function resetUi(){ui.sheet=null;ui.place=null;ui.sel=null;ui.undo=[];ui.prevB=null;ui.lastRoll=G?G.rollId||0:0;ui.lastProd=G&&G.prod?G.prod.id:0;ui.snap=null;ui.recapFrom=G?G.seq:0;ui.myResp={};ui.lastTurnKey='';ui.endSeen=G&&G.phase==='end'?G.seq:-1}
function handle(d,el){
  const m=me();
  switch(d.do){
  case 'start':startLocal();break;
  case 'setup':{const S=ui.setup;const v=isNaN(+d.v)?d.v:+d.v;S[d.k]=v;if(S.op+S.ob>MAXP)S.ob=MAXP-S.op;if(S.op+S.ob<2)S.ob=2-S.op;render();break}
  case 'setupT':{const S=ui.setup;if(d.k==='dice')S.dice=S.dice==='deck'?'random':'deck';else S[d.k]=!S[d.k];render();break}
  case 'continueLocal':mode='local';G=loadSave();resetUi();afterChange(true);render();kick(true);break;
  case 'host':hostGame();break;case 'join':joinGame();break;case 'cancelHost':endOnline();break;
  case 'watch':net.watch=true;applyDoc(net.doc);render();break;
  case 'leave':net.watch=false;mode='local';G=null;net.rev=0;net.gid=null;render();break;
  case 'home':if(mode==='local'){save();G=null;ui.sheet=null;render()}break;
  case 'sheet':ui.sheet=d.s;if(d.s==='trade'){ui.tr={give:[0,0,0,0,0],get:[0,0,0,0,0],tab:ui.tr.tab||'players',bg:-1,bw:-1}}if(d.s==='cards'){ui.devPick=null;ui.wf=[]}render();break;
  case 'close':case 'scrim':if(ui.sheet==='recap')ui.recapFrom=G?G.seq:0;ui.sheet=null;render();break;
  case 'recapOk':ui.recapFrom=G.seq;ui.sheet=null;render();break;
  case 'player':ui.pi=+d.i;ui.sheet='player';render();break;
  case 'roll':if(mine()&&G.phase==='roll')play({t:'roll'});break;
  case 'end':if(mine())play({t:'end'});ui.recapFrom=G?G.seq:0;break;
  case 'pass':if(mine())play({t:'pass'});break;
  case 'confirm':confirmPlace();break;
  case 'cancelPlace':ui.place=null;ui.sel=null;render();break;
  case 'rbdone':play({t:'rbdone'});break;
  case 'buildPick':{if(!mine())break;if(d.k==='dev'){ui.sheet=null;if(play({t:'buy'})){const c=G.players[m].dev[G.players[m].dev.length-1];toast(`You drew ${DEV[c.k].n}.`)}break}
    ui.place=d.k;ui.sel=null;ui.sheet=null;render();break}
  case 'ttab':ui.tr.tab=d.t;render();break;
  case 'tstep':{const v=ui.tr[d.side];v[+d.i]=Math.max(0,v[+d.i]+(+d.d));if(+d.d>0){const o=d.side==='give'?'get':'give';ui.tr[o][+d.i]=0}render();break}
  case 'sendOffer':{if(play({t:'offer',give:ui.tr.give.slice(),get:ui.tr.get.slice()})){ui.sheet='offer';render()}break}
  case 'acceptBy':play({t:'accept',o:+d.o});sfx('trade');ui.sheet=null;render();break;
  case 'cancelOffer':play({t:'cancel'});ui.sheet=null;render();break;
  case 'bgive':ui.tr.bg=+d.i;if(ui.tr.bw===+d.i)ui.tr.bw=-1;render();break;
  case 'bget':ui.tr.bw=+d.i;render();break;
  case 'bankGo':{const tr=ui.tr;if(play({t:'bank',g:tr.bg,w:tr.bw},'bank trade')){sfx('trade');const r=rates(G,m);if(G.players[m].res[tr.bg]<r[tr.bg])tr.bg=-1;ui.sheet='trade';render()}break}
  case 'respond':{const y=d.y==='1';respondOffer(y);break}
  case 'playDev':{const k=d.k;if(k==='windfall'||k==='levy'){ui.devPick=ui.devPick===k?null:k;ui.wf=[];render();break}ui.sheet=null;play({t:'play',k});break}
  case 'wfPick':{const i=+d.i;if(ui.wf.length<2)ui.wf.push(i);else ui.wf=[i];render();break}
  case 'wfGo':ui.sheet=null;play({t:'play',k:'windfall',r:ui.wf.slice()});break;
  case 'levyGo':ui.sheet=null;play({t:'play',k:'levy',r:+d.i});break;
  case 'dstep':{const i=+d.i;ui.disc[i]=Math.max(0,ui.disc[i]+(+d.d));render();break}
  case 'discardGo':{const c=ui.disc.slice();ui.sheet=null;if(!play({t:'discard',c})){ui.sheet='discard'}ui.disc=[0,0,0,0,0];render();break}
  case 'stealGo':ui.sheet=null;play({t:'steal',v:+d.v});if(G.lastSteal&&G.lastSteal.by===m)toast(`You stole 1 ${RNAME[G.lastSteal.r]}.`);break;
  case 'undo':undo();break;
  case 'pref':pref[d.k]=!pref[d.k];savePref();if(d.k==='sound'&&pref.sound)sfx('turn');render();break;
  case 'prefv':pref[d.k]=d.v;savePref();render();break;
  case 'newgame':ui.sheet='confirmNew';render();break;
  case 'reallyNew':if(mode==='online')endOnline();else clearSave();G=null;mode='local';net.watch=false;net.rev=0;net.gid=null;ui.sheet=null;render();break;
  case 'handOff':ui.hi=+d.i;ui.sheet='confirmHand';render();break;
  case 'handGo':ui.sheet=null;handToComputer(ui.hi);break;
  case 'takeBack':takeBack(+d.i);break;
  }}
function respondOffer(y){const m=me(),tr=G.trade;if(!tr)return;ui.myResp[tr.id]=y?'y':'n';ui.sheet=null;
  if(mode==='local'||amWriter()){act(G,{t:'resp',p:m,y,id:tr.id});commit();render();kick(true);return}
  sendResp(m,tr.id,y);render()}
if(!quiet){
  document.addEventListener('click',e=>{
    const svg=e.target.closest&&e.target.closest('[data-board]');
    if(svg&&G&&!ui.sheet){tapBoard(e.clientX,e.clientY);return}
    const b=e.target.closest&&e.target.closest('[data-do]');if(!b||b.disabled)return;const d=b.dataset;
    if(d.do==='scrim'&&e.target!==b)return;if(!d.do)return;
    handle(d,b)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet&&!['discard','steal','incoming','offer'].includes(ui.sheet)){ui.sheet=null;render()}});
  applyTheme();
}

/* ================= ONLINE (each player on their own phone) =================
   games/current : {status, seats, names, bots, opts, gid, rev, g}. Only the phone that must act writes it:
   the human to act, or (for computer turns) whichever phone holds the games/drv lease.
   games/resp_<seat> : that seat's answer to the open trade offer {gid, tid, y}. The writing phone merges them.
   games/back_<seat> : {gid, uid} a replaced person asking for their seat back; the next writer applies it. */
const net={ready:false,off:false,canWrite:null,me:null,db:null,ref:null,drv:null,doc:null,rev:0,gid:null,dirty:false,writing:false,watch:false,side:{},back:{},lastChange:0};
const REFUSED=['invalid_argument','not_granted','revoked'];
const syncErr=e=>e&&REFUSED.includes(e.code)?"This phone can't save moves. Ask the game's owner to share it with you as an Editor.":"That didn't sync. Check your connection and try again.";
function seat(){if(!G||!net.me)return -1;return G.players.findIndex(p=>p.uid===net.me&&!p.bot)}
function amWriter(){if(!G||G.phase==='end')return false;const a=actorOf(G);if(a<0)return false;return G.players[a].bot?(mode==='local'?driving:driving&&net.lease):a===seat()}
function commit(){
  if(mode==='local'){save();return}
  if(mode!=='online'||!net.ref||net.canWrite===false)return;
  applyBacks();net.rev++;net.dirty=true;net.lastChange=Date.now();flush()}
async function flush(){
  if(net.writing||!net.dirty)return;net.writing=true;net.dirty=false;
  const body={status:'play',seats:G.players.map(p=>p.bot?null:p.uid),names:G.players.map(p=>p.name),gid:net.gid,rev:net.rev,g:JSON.parse(JSON.stringify(G))};
  try{await net.ref.set(body)}catch(e){
    if(e&&REFUSED.includes(e.code))net.canWrite=false;
    toast(syncErr(e));net.dirty=false;
    if(net.doc&&net.doc.g){G=JSON.parse(JSON.stringify(net.doc.g));net.rev=net.doc.rev}
    render()}
  net.writing=false;if(net.dirty)flush()}
async function initNet(){
  try{
    if(!window.claude||!window.claude.use){net.off=true;net.ready=true;render();return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?(u=>{if(!u)return u;let d=null;const K="dev_id";for(const s of ["localStorage","sessionStorage"]){try{d=d||window[s].getItem(K)}catch(e){}}if(!d){d=Math.random().toString(36).slice(2,10);for(const s of ["localStorage","sessionStorage"]){try{window[s].setItem(K,d)}catch(e){}}}return u+"~"+d})(await user.id()):null;
    if(!db||!id){net.off=true;net.ready=true;render();return}
    try{net.canWrite=user?await user.can('data.write'):null}catch(e){net.canWrite=null}
    net.db=db;net.me=id;net.ref=db.doc('games/current');net.drv=db.doc('games/drv');
    net.ref.onSnapshot(snap=>{net.ready=true;net.doc=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;applyDoc(net.doc);render()},
      ()=>{net.off=true;net.ready=true;if(mode==='online')toast('Lost the connection to the online game. Reload the page to reconnect.');render()});
    for(let s=0;s<MAXP;s++){
      db.doc('games/resp_'+s).onSnapshot(snap=>{net.side[s]=snap.exists?snap.data():null;mergeSide()},()=>{});
      db.doc('games/back_'+s).onSnapshot(snap=>{net.back[s]=snap.exists?snap.data():null;mergeSide()},()=>{})}
  }catch(e){net.off=true;net.ready=true;render()}
}
function inGame(d){return d&&d.g&&d.g.players.some(p=>p.uid===net.me||p.away===net.me)}
function applyDoc(d){
  const live=d&&d.status==='play'&&d.g&&(inGame(d)||net.watch);
  if(live){
    if(mode!=='online'&&(G===null||net.watch)){mode='online';G=null;net.rev=-1;net.gid=null}
    if(mode==='online'){
      if(d.gid!==net.gid||d.rev>net.rev){const fresh=d.gid!==net.gid;G=JSON.parse(JSON.stringify(d.g));net.gid=d.gid;net.rev=d.rev;net.lastChange=Date.now();
        if(fresh)resetUi();afterChange(fresh);mergeSide()}}
  }else if(mode==='online'){mode='local';G=null;ui.sheet=null;ui.place=null;net.watch=false;net.rev=0;net.gid=null;toast('The online game has ended.')}
}
function mergeSide(){
  if(mode!=='online'||!G||!amWriter())return;let ch=false;
  if(G.trade)for(let s=0;s<G.np;s++){const r=net.side[s];if(r&&r.gid===net.gid&&r.tid===G.trade.id&&G.trade.resp[s]===null){if(act(G,{t:'resp',p:s,y:!!r.y,id:r.tid}))ch=true}}
  if(applyBacks())ch=true;
  if(ch){afterChange();commit();render();kick(true)}}
function applyBacks(){if(!G)return false;let ch=false;
  for(let s=0;s<G.np;s++){const b=net.back[s],P=G.players[s];if(b&&b.gid===net.gid&&P.bot&&P.away&&P.away===b.uid){P.bot=false;P.uid=b.uid;P.away=null;logm(G,s,`${P.name} is back.`);ch=true}}
  return ch}
function sendResp(s,tid,y){if(!net.db)return;net.db.doc('games/resp_'+s).set({gid:net.gid,tid,y:!!y,uid:net.me}).catch(e=>{toast(syncErr(e));if(e&&REFUSED.includes(e.code))net.canWrite=false;render()})}
async function lease(){try{const r=await net.drv.acquire({holder:net.me,ttlMs:6000});return !!(r&&r.acquired)}catch(e){if(e&&REFUSED.includes(e.code))net.canWrite=false;return false}}
function release(){try{if(net.drv)net.drv.acquire({holder:net.me,ttlMs:1000}).catch(()=>{})}catch(e){}}
function handToComputer(s){if(!G||mode!=='online')return;const P=G.players[s];if(!P||P.bot||s===seat())return;
  P.away=P.uid;P.bot=true;P.ai='best';logm(G,s,`${P.name}'s seat is now played by a computer.`);
  if(G.trade&&G.trade.resp[s]===null)act(G,{t:'resp',p:s,y:false});
  commit();render();drive()}
function takeBack(s){if(!net.db)return;net.db.doc('games/back_'+s).set({gid:net.gid,uid:net.me}).then(()=>toast('Your seat comes back at the next move.')).catch(e=>toast(syncErr(e)))}
async function hostGame(){
  const name=(document.getElementById('hn')?.value||'').trim()||'Host';
  const S=ui.setup,n=S.op,b=Math.min(S.ob,MAXP-n);
  const seats=Array(n).fill(null);seats[0]=net.me;const names=Array(n).fill('');names[0]=name;
  try{await net.ref.set({status:'lobby',seats,names,bots:b,opts:{target:S.target,friendly:S.friendly,dice:S.dice},rev:0})}catch(e){if(e&&REFUSED.includes(e.code))net.canWrite=false;toast(syncErr(e));render()}}
async function joinGame(){
  const name=(document.getElementById('jn')?.value||'').trim()||'Player';
  let ok=false;
  for(let t=0;t<10&&!ok;t++){
    try{const l=await net.ref.acquire({holder:net.me,ttlMs:1500});ok=!!l.acquired}
    catch(e){if(e&&REFUSED.includes(e.code)){net.canWrite=false;render();return}}
    if(!ok)await sleep(400+Math.random()*500)}
  if(!ok){toast('Someone else is joining right now. Try again in a moment.');return}
  let d;try{const s=await net.ref.get();d=s.exists?JSON.parse(JSON.stringify(s.data())):null}catch(e){toast(syncErr(e));return}
  if(!d||d.status!=='lobby'){toast('That game is no longer open.');return}
  if(d.seats.includes(net.me))return;
  const i=d.seats.indexOf(null);if(i<0){toast('That game is already full.');return}
  d.seats[i]=net.me;d.names[i]=name;
  if(d.seats.every(Boolean)){
    const used=new Set(d.names);const bn=BOTNAMES.filter(x=>!used.has(x));
    const table=shuffle([...d.names.map((nm,k)=>({name:nm||'Player',uid:d.seats[k]})),...bn.slice(0,d.bots||0).map(nm=>({name:nm,bot:true,ai:'best'}))]);
    const g=newGame(table,d.opts||{});const gid=Math.random().toString(36).slice(2,10);
    const body={status:'play',seats:table.map(t=>t.uid||null),names:table.map(t=>t.name),gid,rev:1,g:JSON.parse(JSON.stringify(g))};
    mode='online';G=g;net.gid=gid;net.rev=1;net.doc=body;resetUi();afterChange(true);render();
    try{await net.ref.set(body);net.lastChange=Date.now();kick(true)}catch(e){if(e&&REFUSED.includes(e.code))net.canWrite=false;else toast(syncErr(e));mode='local';G=null;render()}
  }else{
    try{await net.ref.set(d)}catch(e){if(e&&REFUSED.includes(e.code))net.canWrite=false;else toast(syncErr(e));render()}}}
function endOnline(){if(net.ref)net.ref.set({status:'idle',rev:0}).catch(e=>{toast(syncErr(e));render()})}
let lastMine=false;
function notifyTurn(){if(quiet)return;const m=!!G&&mine();
  const ans=!!G&&G.trade&&me()>=0&&G.trade.from!==me()&&G.trade.resp[me()]===null&&!ui.myResp[G.trade.id];
  if((m||ans)&&!lastMine&&mode==='online')buzz(150);lastMine=m||ans;
  try{document.title=(m||ans)?'Your turn · Atoll':'Atoll'}catch(e){}}
function onlineBox(){
  let inner;const S=ui.setup;
  if(!net.ready)inner='<p class="sub">Connecting…</p>';
  else if(net.off)inner='<p class="note">Online play needs this page opened on claude.ai while signed in. Each player opens it on their own phone.</p>';
  else{
    const d=net.doc,st=d&&d.status;
    const noWrite=net.canWrite===false?`<p class="note"><b>This phone can watch but can't join.</b> The owner needs to open Share, turn off "Anyone with the link", and invite you by email as an Editor, then reload.</p>`:'';
    if(noWrite&&st!=='play')inner=(st==='lobby'?`<p><b>${esc(d.names[0]||'Someone')}</b> is hosting a game.</p>`:'')+noWrite;
    else if(st==='lobby'){
      const joined=d.seats.filter(Boolean).length,need=d.seats.length,bots=d.bots||0;
      const roster=d.seats.map((u,i)=>u?esc(d.names[i]||'Player'):'open seat').join(', ')+(bots?`, ${bots} computer${bots>1?'s':''}`:'');
      if(d.seats.includes(net.me))inner=`<p><b>Waiting for players.</b> ${joined} of ${need} people are in.</p><p class="sub">${roster}</p><p class="sub">Others open this page on their phones and tap Join.</p>${d.seats[0]===net.me?'<button class="btn" data-do="cancelHost">Cancel game</button>':''}`;
      else inner=`<p><b>${esc(d.names[0]||'Someone')}</b> is hosting. ${joined} of ${need} people are in.</p><p class="sub">${roster}</p><label class="field" for="jn">Your name<input id="jn" placeholder="Player" maxlength="14" autocomplete="off"></label><button class="btn primary wide" data-do="join">Join game</button>`}
    else if(st==='play'&&d.g){const away=d.g.players.findIndex(p=>p.away===net.me);
      inner=`<p>${d.g.players.map(p=>esc(p.name)).join(', ')} are playing (turn ${d.g.turnNo}).</p>${away>=0?`<button class="btn primary wide" data-do="takeBack" data-i="${away}">Take my seat back</button>`:''}<div class="row"><button class="btn" data-do="watch">Watch</button><button class="btn" data-do="newgame">End it</button></div>`}
    else inner=`<label class="field" for="hn">Your name<input id="hn" placeholder="Host" maxlength="14" autocomplete="off"></label>
      <div class="pick"><span>People, including you</span>${seg('op',[2,3,4,5,6],S.op)}</div>
      <div class="pick"><span>Computer players</span>${seg('ob',[0,1,2,3,4],S.ob,null,v=>S.op+v>MAXP)}</div>
      <p class="sub">Uses the points, Raider and dice options above.</p>
      <button class="btn deep wide" data-do="host">Host a game</button><p class="sub">Then each person opens this page on their phone and taps Join. Seats are drawn at random.</p>`}
  return `<section class="box"><h2>Each on their own phone</h2>${inner}</section>`}
if(typeof setInterval!=='undefined'&&(!quiet||typeof NETTEST!=='undefined'))setInterval(()=>{
  if(mode!=='online'||!G||driving||net.canWrite===false||seat()<0)return;
  if(actorBot()&&Date.now()-net.lastChange>(typeof NETTEST!=='undefined'?400:3500))drive();
  if(G.trade&&amWriter())mergeSide()},typeof NETTEST!=='undefined'?150:1500);

function start(data){G=data&&data.G?data.G:null;mode='local';if(G)resetUi(),afterChange(true);render();initNet();if(G)kick(true)}
if(!quiet){
  if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>mode==='local'&&G?{G}:{});
  window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}

</script>
</body>
</html>
