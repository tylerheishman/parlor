  const m=raidMoves(S,pi,'raid',false)[0];
  if(!m){let h=(S.raider+1)%S.board.hexes.length;raiderMove(S,pi,h,raidTargets(S,pi,h)[0]??-1);return}
  if(!raiderMove(S,pi,m.hex,m.vic)){const h=(S.raider+1)%S.board.hexes.length;raiderMove(S,pi,h,raidTargets(S,pi,h)[0]??-1)}
}
function botKeep(S,pi,cards){
  const L=MOONS-S.moon,keep=[];
  for(const id of cards){const info=charterInfo(S,id);let pr;
    if(info.route){const need=routeNeed(S,pi,info.route[0],info.route[1]);pr=need>=99?0:Math.max(0,1-need/(2.3*L+1))**1.3}
    else pr=ambProb(S,pi,id,L);
    if(charterDone(S,pi,id)||pr*(info.pts+RULES.chPen)-RULES.chPen>.4)keep.push(id)}
  return keep;
}
function charterEV(S,pi,id){
  const info=charterInfo(S,id);let pr;
  if(info.route){const d=info.dist;pr=Math.max(.15,Math.min(.85,1.15-d*.075))}
  else pr={kin5:.6,halls2:.55,build5:.5,craft4:.5,terr5:.55,harb2:.45,nohard:.6,road9:.45,shoal2:S.board.hexes.length>19?.45:.3}[id]||.4;
  return pr*(info.pts+(S.opts.forgive?0:RULES.chPen))-(S.opts.forgive?0:RULES.chPen);
}
function botCharters(S,pi){
  const p=S.players[pi];const ev=p.offer.map(id=>({id,v:charterEV(S,pi,id)+Math.random()*.3})).sort((a,b)=>b.v-a.v);
  const keep=[ev[0].id,ev[1].id];if(ev[2].v>.6)keep.push(ev[2].id);
  chooseCharters(S,pi,keep);
}
function setupSpotScore(S,pi,v){
  const geo=geoOf(S.board),VH=vh(geo,S),p=S.players[pi];
  const W=[.42,.42,.5,.46,.4,.45];let s=0;const kinds=new Set();
  for(const x of VH[v]){s+=x.p*W[x.g]*30;kinds.add(x.g)}
  // diversity with what we already have
  const have=new Set();for(let u=0;u<S.bv.length;u++)if(owner(S.bv[u])===pi)VH[u].forEach(x=>have.add(x.g));
  kinds.forEach(k=>{if(!have.has(k))s+=.6});
  const port=geo.portOf[v];if(port!==null)s+=port===-1?.5:.6;
  // route charters: closeness to their landmarks
  for(const id of p.ch){if(id[0]!=='R')continue;const a=+id[1],b=+id[2];const m=S.board.marks;
    const da=geoOf(S.board).mdist;const dv=bfsDist(geo,v);s+=Math.max(0,3-Math.min(dv[m[a]],dv[m[b]])*.45);}
  if(p.ch.includes('shoal2')||p.ch.includes('terr5'))s+=kinds.size*.2+(VH[v].some(x=>x.g===5)?.5:0);
  if(p.ch.includes('harb2')&&port!==null)s+=1;
  return s;
}
function botSetup(S,pi){
  const geo=geoOf(S.board);
  const spots=setupHouseSpots(S,pi).map(v=>({v,s:setupSpotScore(S,pi,v)+Math.random()*.2})).sort((a,b)=>b.s-a.s);
  if(wOf(S,pi).setupEval){
    // judge the best few corners (and each road from them) by the full evaluation
    let best=null,bv=-1e9;const D=determinize(S,pi);
    for(const sp of spots.slice(0,8))for(const e of geo.verts[sp.v].edges){if(S.er[e]!==-1)continue;const T=cloneS(D);T.quiet=true;T.halt=true;
      if(!placeSetup(T,pi,sp.v,e))continue;const x=evalP(T,pi)+sp.s*.15+Math.random()*.05;if(x>bv){bv=x;best={v:sp.v,e}}}
    if(best){placeSetup(S,pi,best.v,best.e);return}
  }
  const v=spots[0].v;
  // road toward the best open spot two steps away (or a landmark we need)
  let best=null,bs=-1e9;
  for(const e of geo.verts[v].edges){if(S.er[e]!==-1)continue;const E=geo.edges[e],w=E.a===v?E.b:E.a;let s=0;
    for(const x of geo.verts[w].nbr){if(x===v)continue;if(free5(S,x)&&!geo.verts[v].nbr.includes(x))s=Math.max(s,setupSpotScore(S,pi,x)*.5)}
    s+=geo.verts[w].hexes.length*.2+Math.random()*.1;
    if(s>bs){bs=s;best=e}}
  placeSetup(S,pi,v,best);
}

/* ---- the strong chooser ---- */
function oppLoss(S,pi){
  const loss={};
  for(let oi=0;oi<S.np;oi++){
    if(oi===pi||freeKin(S.players[oi])<=0)continue;
    const T=cloneS(S);T.quiet=true;T.turn=oi;T.offers=[];
    const b=evalP(T,oi),gains=[];
    for(const id of T.spaces){if(!canPlace(T,oi,id))continue;let g=-1e9;
      for(const m of spaceMoves(T,oi,id,false)){const U=tryMove(T,oi,m);if(U){const x=evalP(U,oi)-b;if(x>g)g=x}}
      if(g>-1e9)gains.push({id,g})}
    gains.sort((x,y)=>y.g-x.g);
    if(gains.length>1){const d=gains[0].g-gains[1].g;if(d>0)loss[gains[0].id]=(loss[gains[0].id]||0)+d}
  }
  return loss;
}
function stepBot(S){
  // advance one decision of whoever is to act (used in playouts and by the in-game runner)
  const pi=S.turn;
  switch(S.phase){
    case 'charter':botCharters(S,pi);return;
    case 'setup':botSetup(S,pi);return;
    case 'raider':botRaider(S,pi);return;
    case 'feast':botFeed(S,pi);return;
    case 'work':{if(S.pend&&S.pend.pi===pi){keepCharters(S,pi,botKeep(S,pi,S.pend.cards));return}
      const m=quickMove(S,pi);if(!m||!applyFull(S,pi,m)){S.players[pi].placed=S.players[pi].kin;nextTurn(S)}return}
  }
}
function playout(S,pi,toEnd,myNext){
  let g=0,mine=0;S.halt=!toEnd;
  if(S.phase==='pause'){if(!toEnd)return;S.phase='work';startMoon(S)}
  while(S.phase!=='end'&&S.phase!=='pause'&&g++<900){
    if(!toEnd&&S.phase==='work'&&S.turn===pi&&!S.pend){if(!myNext||mine++>=1)break} // back to us: judge here (after our own next move if asked)
    stepBot(S);
  }
}
function botChoose(S0,pi,levelName){
  // Strongest setting, as measured: with two players, look ahead through the opponent's reply and our next move;
  // with three or more, rollouts added noise, so judge by the evaluation plus denial of rivals' best spaces.
  const name=levelName||'strong';
  const lv=name==='strong'?(S0.np===2?LEVEL.search:LEVEL.deny):LEVEL[name],t0=NOW();
  const S=determinize(S0,pi);
  const cands=genMoves(S,pi,true);
  if(!cands.length)return null;
  const deny=lv.deny?oppLoss(S,pi):{};
  const W=wOf(S,pi);
  const scored=[];
  for(const m of cands){const T=tryMove(S,pi,m);if(!T)continue;scored.push({m,v:evalP(T,pi)+(deny[m.sp]||0)*W.deny+Math.random()*W.noise})}
  if(!scored.length)return null;
  scored.sort((a,b)=>b.v-a.v);
  if(lv.K<=1||lv.R<=0||(lv.rollFrom&&S.moon<lv.rollFrom))return scored[0].m;
  const late=S.moon>=lv.endFrom;
  const K=late?lv.endK:lv.K,R=late?lv.endR:lv.R;
  // the best few, at most two per space, within reach of the best
  const top=[];const seenSp={};
  for(const x of scored){if(top.length>=K)break;if(x.v<scored[0].v-2.5)break;const key=x.m.sp;if((seenSp[key]||0)>=2)continue;seenSp[key]=(seenSp[key]||0)+1;top.push(x)}
  if(top.length<=1)return scored[0].m;
  const kap=lv.kap!==undefined?lv.kap:S.np===2?1:.5;
  const tot=top.map(()=>0);let r=0;
  for(;r<R;r++){
    if(r>=1&&NOW()-t0>(lv.budget||1e9))break;
    const D=determinize(S0,pi);
    top.forEach((x,i)=>{const T=tryMove(D,pi,x.m);if(!T){tot[i]-=99;return}
      playout(T,pi,late,lv.myNext);
      if(T.phase==='end'){const me=total(T,pi);let mx=-1e9;for(let q=0;q<T.np;q++)if(q!==pi)mx=Math.max(mx,total(T,q));tot[i]+=me-mx+me*.2+(T.winner===pi?1.5:0)}
      else tot[i]+=relVal(T,pi,kap)+(deny[x.m.sp]||0)*W.deny});
  }
  let bi=0;
  if(lv.blend!==undefined){const rr=tot.map(t=>t/r),mean=rr.reduce((x,y)=>x+y,0)/rr.length;const f=top.map((x,i)=>x.v+lv.blend*(rr[i]-mean));for(let i=1;i<top.length;i++)if(f[i]>f[bi])bi=i}
  else for(let i=1;i<top.length;i++)if(tot[i]>tot[bi])bi=i;
  if(AIDBG)AIDBG.push({moon:S.moon,pi,r,ms:Math.round(NOW()-t0),top:top.map((x,i)=>({sp:x.m.sp,v:+x.v.toFixed(2),r:+(tot[i]/r).toFixed(2)}))});
  return top[bi].m;
}
/* Bots trade with each other and with people through standing offers. */
function botOffers(S,pi){
  const p=S.players[pi];
  // accept offers that help us and do not hand the leader too much
  const D=S.offers.length?determinize(S,pi):null; // judge others without peeking at their charters
  for(let k=S.offers.length-1;k>=0;k--){const o=S.offers[k];if(!offerOk(S,o,pi))continue;
    const T=cloneS(D);T.quiet=true;if(!acceptOffer(T,pi,k))continue;
    const gMe=evalP(T,pi)-evalP(D,pi),gThem=evalP(T,o.by)-evalP(D,o.by);
    const lead=scoreOf(S,o.by,true).total-Math.max(...S.players.map((q,i)=>i===o.by?-99:scoreOf(S,i,true).total));
    if(gMe>.25&&gMe>=gThem*(lead>2?1.2:.5)-.2){acceptOffer(S,pi,k);break}}
  // post one offer: 2 of our most spare good for 1 of what we miss for a house or hall
  if(S.offers.some(o=>o.by===pi))return;
  const tg=targetCosts(S,pi).filter(t=>t.k==='house'||t.k==='hall');
  for(const t of tg){const mm=missingOf(p,t.c);if(mm.n!==1||mm.m[5])continue;const want=mm.m.indexOf(1);
    let give=-1,sp=1;for(let g=0;g<5;g++){if(g===want)continue;const spare=p.res[g]-t.c[g];if(spare>=2&&spare>sp){sp=spare;give=g}}
    if(give<0)continue;const gv=[0,0,0,0,0,0],gt=[0,0,0,0,0,0];gv[give]=sp>=4?2:1;gt[want]=1;
    if(gv[give]===1&&rateOf(S,pi,give)<=2)continue;
    postOffer(S,pi,gv,gt);return}
}

</script>
<script>
/* ================= Strand — app shell, screens and input ================= */
let G=null,mode='local';
const ui={view:'board',sel:null,act:null,sheet:null,toast:null,busy:false,botTimer:null,screen:'home',
  setup:{lp:1,lb:3,op:2,ob:1},names:['You','Player 2','Player 3','Player 4','Player 5'],targets:[],hl:{},hlSeen:{},newV:new Set(),newE:new Set(),newH:new Set(),lit:new Set(),
  keep:[],pick:[],bz:[],bzGive:0,bzGet:3,offerGive:[0,0,0,0,0,0],offerGet:[0,0,0,0,0,0],setupSel:null,rsel:null,cover:-1,shown:-1,recapOpen:true,lastFx:0,peek:null,tradeTab:'supply'};
const net={ready:false,off:false,db:null,me:null,ref:null,doc:null,rev:0,gid:null,dirty:false,writing:false,canWrite:null,watch:false,driver:false,pending:null,lastMine:false,repairT:null,lastRev:-1};
const seen={};
const PREF_KEY='strand-prefs',SAVE_KEY='strand-save';
const prefs={sound:false,haptic:true,theme:'auto',confirm:true,tips:true,calm:false,forgive:false,open:false,played:0};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF_KEY)||'{}'))}catch(e){}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs))}catch(e){}}
function applyTheme(){try{if(prefs.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',prefs.theme)}catch(e){}}
applyTheme();
function save(){if(mode!=='local'||!G)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return null;const g=JSON.parse(s);return g&&g.v===2&&g.phase!=='end'?g:null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,cls)=>`<svg class="ic ${cls||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const resIc=g=>ic(RES[g]);
const pcv=i=>`--pc:var(--p${i});--pk:var(--pk${i})`;
function costHTML(c){let o='';for(let g=0;g<6;g++)if(c[g])o+=`<span class="res" title="${RN[g]}">${c[g]}${resIc(g)}</span>`;return o||'<span class="sub">free</span>'}

/* ---------- sound + haptics ---------- */
let AC=null;
function tone(f,d,type,vol,slide){
  if(!prefs.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const SFX={tap:()=>tone(660,.05,'triangle',.04),place:()=>{tone(220,.09,'triangle',.09);tone(330,.07,'sine',.05)},build:()=>{tone(180,.12,'square',.04);setTimeout(()=>tone(270,.1,'triangle',.06),60)},
  tide:()=>tone(300,.4,'sine',.05,120),turn:()=>{tone(784,.12,'sine',.07);setTimeout(()=>tone(1046,.16,'sine',.06),110)},feast:()=>{tone(523,.15,'sine',.06);setTimeout(()=>tone(659,.15,'sine',.06),120);setTimeout(()=>tone(784,.2,'sine',.06),240)},bad:()=>tone(150,.15,'sawtooth',.04)};
function buzz(ms){if(!prefs.haptic)return;try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ---------- whose turn ---------- */
const actorIdx=()=>!G?-1:G.pend?G.pend.pi:G.turn;
const actor=()=>G.players[actorIdx()];
const seat=()=>net.doc&&net.doc.seats?net.doc.seats.indexOf(net.me):-1;
function mine(){if(!G||G.phase==='end'||G.phase==='pause')return false;const i=actorIdx();if(G.players[i].bot)return false;if(mode==='local')return true;return seat()===i}
function meIdx(){
  if(!G)return 0;
  if(mode==='online'&&seat()>=0)return seat();
  if(mine())return actorIdx();
  if(ui.lastHuman>=0&&ui.lastHuman<G.np&&!G.players[ui.lastHuman].bot)return ui.lastHuman;
  const h=G.players.findIndex(p=>!p.bot);return h<0?0:h;
}
const humans=()=>G.players.filter(p=>!p.bot).length;
function flash(t){ui.toast=t;clearTimeout(ui.toastT);ui.toastT=setTimeout(()=>{ui.toast=null;render()},2600)}

/* ---------- starting games ---------- */
function startLocal(specs){
  mode='local';G=newGame(shuffle(specs),{calm:prefs.calm,forgive:prefs.forgive,open:prefs.open});
  ui.screen='game';ui.view='island';ui.sheet=null;ui.act=null;ui.sel=null;ui.cover=-1;ui.shown=-1;ui.lastHuman=-1;for(const k in seen)delete seen[k];
  prefs.played++;savePrefs();save();render();runBots();
}
function localSpecs(){
  const S=ui.setup,specs=[];
  for(let i=0;i<S.lp;i++)specs.push({name:(ui.names[i]||'').trim()||(S.lp===1?'You':'Player '+(i+1))});
  shuffle(BOTNAMES.slice()).slice(0,S.lb).forEach(n=>specs.push({name:n,bot:true}));
  return specs;
}

/* ---------- undo: one snapshot per human turn, dropped when hidden information comes out ---------- */
function snapTurn(){
  const pi=actorIdx();
  if(G.undo&&G.undo.by===pi&&G.undo.open)return;
  G.undo={by:pi,open:true,hid:G.hid,label:'',snap:JSON.stringify(Object.assign({},G,{undo:null}))};
}
function closeTurn(label){if(G.undo&&G.undo.open){G.undo.open=false;G.undo.label=label}}
function canUndo(){
  if(!G||!G.undo||ui.busy||ui.act||G.phase==='end')return false;
  if(G.hid!==G.undo.hid)return false;
  const me=mode==='online'?seat():G.undo.by;if(G.undo.by!==me)return false;
  return !G.players[G.undo.by].bot;
}
function undo(){
  if(!canUndo())return;const u=G.undo;
  G=JSON.parse(u.snap);G.undo=null;ui.act=null;ui.sel=null;ui.setupSel=null;ui.rsel=null;ui.sheet=null;
  flash('Took that back.');afterChange(true);
}

/* ---------- applying a human move ---------- */
function afterHuman(label){
  const pi=ui.actingAs;closeTurn(label);ui.lastHuman=pi;seen[pi]=G.seq;ui.recapOpen=false;
  afterChange(true);
}
function afterChange(byMe){
  if(byMe&&mode==='online'){net.driver=true}
  fxScan();save();if(byMe)commit();render();runBots();
}
function doCommit(m,label){
  const pi=actorIdx();ui.actingAs=pi;
  const T=cloneS(G);
  if(!applyMove(T,pi,m)){SFX.bad();flash("That move isn't allowed right now.");return false}
  snapTurn();T.undo=G.undo;G=T;ui.act=null;ui.sel=null;
  SFX.place();buzz(10);afterHuman(label||SPACES[m.sp].name);return true;
}

/* ---------- computer turns: one at a time with a short pause ---------- */
function botsToRun(){if(!G||G.phase==='end'||G.phase==='pause')return false;if(!actor().bot)return false;return mode==='local'||net.driver}
function botStep(){
  const pi=actorIdx();
  if(G.phase==='work'&&!G.pend){
    botOffers(G,pi);
    let m=null;try{m=botChoose(G,pi,'strong')}catch(e){console.error(e)}
    if(m){const T=cloneS(G);if(applyFull(T,pi,m)){G=T;return}}
    const q=quickMove(determinize(G,pi),pi);if(q){const T=cloneS(G);if(applyFull(T,pi,q)){G=T;return}}
    G.players[pi].placed=G.players[pi].kin;nextTurn(G);
  }else stepBot(G);
}
function runBots(){
  if(ui.botTimer)return;
  if(!botsToRun()){if(ui.busy){ui.busy=false;render()}return}
  ui.busy=true;
  const delay=ui.fast?1:G.phase==='work'?620:G.phase==='setup'?520:380;
  ui.botTimer=setTimeout(()=>{
    ui.botTimer=null;
    if(!botsToRun()){ui.busy=false;render();return}
    try{botStep()}catch(e){console.error(e);try{stepBot(G)}catch(e2){}}
    ui.busy=botsToRun();
    fxScan();save();if(mode==='online')commit();render();runBots();
  },delay);
  render();
}

/* ---------- effects: highlight what just happened ---------- */
function fxScan(){
  if(!G)return;const from=ui.lastFx;ui.lastFx=G.seq;if(from>=G.seq)return;
  const ents=G.log.filter(l=>l.s>from);
  let tide=false,feast=false,built=false;
  ents.forEach(l=>{
    if(l.fx){if(l.fx.sp)ui.hl[l.fx.sp]=Date.now();(l.fx.v||[]).forEach(v=>{ui.newV.add(v);built=true});(l.fx.e||[]).forEach(e=>{ui.newE.add(e);built=true});(l.fx.h||[]).forEach(h=>ui.newH.add(h))}
    if(l.tides){tide=true;ui.lit=new Set();G.board.hexes.forEach((h,i)=>{if(l.tides.includes(h.n)&&h.n!==7)ui.lit.add(i)});ui.tideGot=l.got}
    if(l.feast)feast=true;
  });
  if(tide){SFX.tide();ui.tideAt=Date.now();setTimeout(()=>{ui.lit=new Set();render()},2200)}
  if(built)SFX.build();if(feast)SFX.feast();
  setTimeout(()=>{ui.newV.clear();ui.newE.clear();ui.newH.clear()},900);
}

/* ---------- human input: action board ---------- */
function actKind(id){const d=SPACES[id];if(d.build)return 'build';if(d.craft)return 'craft';if(d.raid)return 'raid';if(d.bazaar)return 'bazaar';if(d.pick)return 'pick';return 'none'}
function pickSpace(id){
  if(!mine()||G.phase!=='work'||G.pend||ui.act)return;
  if(!canPlace(G,G.turn,id)){const why=whyNot(id);if(why)flash(why);SFX.bad();return}
  SFX.tap();
  if(prefs.confirm){ui.sel=ui.sel===id?null:id;render()}else startAct(id);
}
function whyNot(id){
  const s=G.sp[id],p=G.players[G.turn];if(!s)return '';
  if(s.occ>=0)return `${G.players[s.occ].name} is already on ${SPACES[id].name}.`;
  const d=SPACES[id];if(d.grow===1&&beds(p)<=p.kin)return 'Kinfolk needs a free bed. Build a house or hall first.';
  if(d.grow&&p.kin>=MAXKIN)return 'Your family is full (5).';
  return '';
}
function startAct(id){
  const k=actKind(id),pi=G.turn,p=G.players[pi];ui.sel=null;
  if(k==='none'){doCommit({sp:id});return}
  ui.act={sp:id,kind:k,b:[],g:[],bz:[],c:null,hex:null,vic:null};
  if(k==='build'){ui.view='island'}
  else if(k==='craft'){ui.view='market';if(!G.market.some(c=>c&&has(p,CRAFTS[c].cost)))flash('You cannot pay for any craft yet. Trade first, or cancel.')}
  else if(k==='raid'){ui.view='island'}
  else if(k==='pick'){ui.sheet='pick'}
  else if(k==='bazaar'){ui.sheet='bazaar';ui.bzGive=p.res.slice(0,5).indexOf(Math.max(...p.res.slice(0,5)));ui.bzGet=ui.bzGive===3?2:3}
  render();
}
function cancelAct(){ui.act=null;ui.sheet=null;ui.view='board';render()}

/* build steps on the island */
function buildState(){
  const a=ui.act,pi=G.turn,T=cloneS(G);T.quiet=true;
  const ok=applyMove(T,pi,{sp:a.sp,b:a.b,preview:true});
  if(!ok)return null;
  const L=buildLimits(G,pi,a.sp),p=T.players[pi];
  const roads=a.b.filter(b=>b.k==='road').length,homes=a.b.filter(b=>b.k!=='road').length;
  const nextRoadFree=roads<L.free;
  const rc=nextRoadFree?[0,0,0,0,0,0]:roadCost(p,L.ship);
  const canR=roads<L.roads&&has(p,rc)&&p.roads<15;
  const limH=L.halls||L.homes;
  const canHo=!L.halls&&homes<L.homes&&has(p,HOUSE)&&p.houses<5;
  const hc=hallCost(p,L.hallDisc);const canHa=homes<limH&&has(p,hc)&&p.halls<4;
  const t=[];
  if(canR)roadSpots(T,pi).forEach(e=>t.push({k:'e',i:e}));
  if(canHo)houseSpots(T,pi).forEach(v=>t.push({k:'v',i:v,b:'house'}));
  if(canHa)for(let v=0;v<T.bv.length;v++)if(T.bv[v]===pi*2)t.push({k:'v',i:v,b:'hall'});
  return {T,L,roads,homes,rc,hc,targets:t,nextRoadFree,canR,canHo,canHa};
}
function onTarget(t){
  if(!G)return;
  // setup placement
  if(G.phase==='setup'&&mine()){
    const pi=G.turn;
    if(t.k==='v'){ui.setupSel={v:t.i,e:null}}
    else if(t.k==='e'&&ui.setupSel)ui.setupSel.e=t.i;
    SFX.tap();render();return;
  }
  if(G.phase==='raider'&&mine()){if(t.k==='h'){const vs=raidTargets(G,G.turn,t.i);ui.rsel={hex:t.i,vic:vs.length===1?vs[0]:vs.length?null:-1};SFX.tap();render()}return}
  if(!ui.act)return;
  const a=ui.act;
  if(a.kind==='build'){
    const last=a.b[a.b.length-1];
    if(last&&((t.k==='e'&&last.k==='road'&&last.at===t.i)||(t.k==='v'&&last.k!=='road'&&last.at===t.i))){a.b.pop();SFX.tap();render();return}
    if(t.k==='e')a.b.push({k:'road',at:t.i});else if(t.k==='v')a.b.push({k:t.b,at:t.i});
    if(!buildState()){a.b.pop();SFX.bad();flash("You can't build there.")}else SFX.build();
    render();return;
  }
  if(a.kind==='raid'&&t.k==='h'){const vs=raidTargets(G,G.turn,t.i);a.hex=t.i;a.vic=vs.length===1?vs[0]:vs.length?null:-1;SFX.tap();render()}
}

function islandTap(e,svg){

/* ================= Strand — drawing ================= */
const HS=40;
const TERR_GLYPH=['wood','clay','stone','grain','wool','food',null];
const HOUSE_P='M-7.5,7 L-7.5,-2 L0,-9.5 L7.5,-2 L7.5,7 Z';
const HALL_P='M-11,8 L-11,-1.5 L-5.5,-7 L0,-2 L0,-4.5 L5.5,-10.5 L11,-4.5 L11,8 Z';
const hexPts=(geo,i)=>geo.corners[i].map(v=>`${(geo.verts[v].x*HS).toFixed(1)},${(geo.verts[v].y*HS).toFixed(1)}`).join(' ');
function islandSVG(o){
  o=o||{};
  const geo=geoOf(G.board),B=G.board,pad=o.mini?30:34;
  const W=geo.w*HS+pad*2,H=geo.h*HS+pad*2;
  const me=meIdx(),myMarks=new Set();
  if(!o.mini){G.players[me].ch.forEach(id=>{if(id[0]==='R'){myMarks.add(+id[1]);myMarks.add(+id[2])}})}
  if(o.marks)o.marks.forEach(m=>myMarks.add(m));
  let s=`<svg class="island" viewBox="${(-W/2).toFixed(0)} ${(-H/2).toFixed(0)} ${W.toFixed(0)} ${H.toFixed(0)}" ${o.mini?'':'data-do="island"'} role="img" aria-label="The island">`;
  // sea halo and foam
  s+='<g>';B.hexes.forEach((h,i)=>{const c=geo.hc[i];s+=`<circle cx="${(c.x*HS).toFixed(1)}" cy="${(c.y*HS).toFixed(1)}" r="${HS*1.42}" class="sea"/>`});s+='</g>';
  s+='<g opacity=".55">';B.hexes.forEach((h,i)=>{const c=geo.hc[i];s+=`<circle cx="${(c.x*HS).toFixed(1)}" cy="${(c.y*HS).toFixed(1)}" r="${HS*1.12}" fill="var(--foam)"/>`});s+='</g>';
  // harbors
  if(!o.mini)B.ports.forEach(pt=>{const e=geo.edges[pt.e],a=geo.verts[e.a],b=geo.verts[e.b];const len=Math.hypot(e.mx,e.my)||1;const px=(e.mx+e.mx/len*.62)*HS,py=(e.my+e.my/len*.62)*HS;
    s+=`<g class="port"><line x1="${a.x*HS}" y1="${a.y*HS}" x2="${px}" y2="${py}"/><line x1="${b.x*HS}" y1="${b.y*HS}" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="12"/>`;
    if(pt.g<0)s+=`<text x="${px}" y="${py}">3:1</text>`;else s+=`<use href="#i-${RES[pt.g]}" x="${px-7}" y="${py-9}" width="14" height="14" style="color:var(--ink)"/><text x="${px}" y="${py+7}" style="font-size:7px">2:1</text>`;
    s+='</g>'});
  // hexes
  B.hexes.forEach((h,i)=>{
    const c=geo.hc[i],cx=c.x*HS,cy=c.y*HS,t=TERR[h.t];
    const lit=ui.lit.has(i),tgt=o.hexT&&o.hexT.has(i);
    s+=`<g class="${lit?'lit':''}"><polygon class="hex hx-${t.id}" points="${hexPts(geo,i)}"/>`;
    const gl=TERR_GLYPH[h.t];
    if(gl)s+=`<use href="#i-${gl}" class="glyph" x="${cx-9}" y="${cy-HS*.72}" width="18" height="18"/>`;
    else s+=`<g class="glyph" opacity=".5"><circle cx="${cx-8}" cy="${cy-14}" r="2"/><circle cx="${cx+6}" cy="${cy-18}" r="1.5"/><circle cx="${cx+3}" cy="${cy-9}" r="1.8"/></g>`;
    if(h.n){const hot=pip(h.n)===5;s+=`<circle class="tok" cx="${cx}" cy="${cy+3}" r="${o.mini?11:13}"/><text class="num ${hot?'hot':''}" x="${cx}" y="${cy+1}">${h.n}</text>`;
      if(!o.mini){const n=pip(h.n);for(let k=0;k<n;k++)s+=`<circle class="pips ${hot?'hot':''}" cx="${cx+(k-(n-1)/2)*3.2}" cy="${cy+10.5}" r="1.1"/>`}}
    if(tgt)s+=`<polygon class="tgth" points="${hexPts(geo,i)}"/>`;
    s+='</g>';
  });
  // roads
  G.er.forEach((o2,e)=>{if(o2<0)return;const E=geo.edges[e],a=geo.verts[E.a],b=geo.verts[E.b];
    const x1=(a.x*.82+b.x*.18)*HS,y1=(a.y*.82+b.y*.18)*HS,x2=(b.x*.82+a.x*.18)*HS,y2=(b.y*.82+a.y*.18)*HS;const nw=ui.newE.has(e);
    s+=`<line class="roadk ${nw?'newroad':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="road ${nw?'newroad':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--p${o2})"/>`});
  if(o.ghostE)o.ghostE.forEach(e=>{const E=geo.edges[e],a=geo.verts[E.a],b=geo.verts[E.b];s+=`<line class="roadk ghost" x1="${(a.x*.82+b.x*.18)*HS}" y1="${(a.y*.82+b.y*.18)*HS}" x2="${(b.x*.82+a.x*.18)*HS}" y2="${(b.y*.82+a.y*.18)*HS}"/><line class="road ghost newroad" x1="${(a.x*.82+b.x*.18)*HS}" y1="${(a.y*.82+b.y*.18)*HS}" x2="${(b.x*.82+a.x*.18)*HS}" y2="${(b.y*.82+a.y*.18)*HS}" stroke="var(--p${o.ghostP})"/>`});
  // landmarks
  B.marks.forEach((v,i)=>{const p=geo.verts[v];const len=Math.hypot(p.x,p.y)||1;const x=(p.x+p.x/len*.42)*HS,y=(p.y+p.y/len*.42)*HS;
    s+=`<g class="mk ${myMarks.has(i)?'mine':''}"><line x1="${p.x*HS}" y1="${p.y*HS}" x2="${x}" y2="${y}" stroke="var(--ink)" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="${o.mini?8:9.5}"/><text x="${x}" y="${y}">${MARKS[i][0]}</text></g>`});
  // buildings
  const drawB=(v,b,ghost)=>{const p=geo.verts[v],x=p.x*HS,y=p.y*HS,ow=owner(b),hall=isHall(b),nw=ui.newV.has(v);
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><path class="bld ${nw||ghost?'new':''} ${ghost?'ghost':''}" d="${hall?HALL_P:HOUSE_P}" fill="var(--p${ow})" stroke="var(--pk${ow})"/></g>`};
  G.bv.forEach((b,v)=>{if(b<0)return;if(o.ghostV&&o.ghostV.has(v))return;s+=drawB(v,b)});
  if(o.ghostV)o.ghostV.forEach((b,v)=>{s+=drawB(v,b,true)});
  // raider
  {const c=geo.hc[G.raider],x=c.x*HS,y=c.y*HS-HS*.5;const nw=ui.newH.has(G.raider);
    s+=`<g transform="translate(${x},${y})"><g class="${nw?'raider':''}"><path d="M-13,1 Q0,9 13,1 L10,-1 L-10,-1 Z" fill="#1b1b22" stroke="#fff" stroke-width="1"/><path d="M0,-1 L0,-15 M0,-14 L8,-6 L0,-5" stroke="#1b1b22" stroke-width="2" fill="#c33"/></g></g>`}
  // targets
  if(o.targets){o.targets.forEach(t=>{
    if(t.k==='v'){const p=geo.verts[t.i];s+=`<circle class="tgt" cx="${p.x*HS}" cy="${p.y*HS}" r="${t.b==='hall'?11:8}"/>`}
    else if(t.k==='e'){const E=geo.edges[t.i],a=geo.verts[E.a],b=geo.verts[E.b];s+=`<line class="tgtl" x1="${(a.x*.8+b.x*.2)*HS}" y1="${(a.y*.8+b.y*.2)*HS}" x2="${(b.x*.8+a.x*.2)*HS}" y2="${(b.y*.8+a.y*.2)*HS}"/>`}
  })}
  s+='</svg>';
  return s;
}
function targetCoords(list){
  const geo=geoOf(G.board);
  return list.map(t=>{if(t.k==='v'){const p=geo.verts[t.i];return Object.assign({x:p.x*HS,y:p.y*HS},t)}
    if(t.k==='e'){const E=geo.edges[t.i];return Object.assign({x:E.mx*HS,y:E.my*HS},t)}
    const c=geo.hc[t.i];return Object.assign({x:c.x*HS,y:c.y*HS},t)});
}

/* ---------- island view ---------- */
function islandView(){
  const o={};ui.targets=[];
  const pi=actorIdx();
  if(mine()&&G.phase==='setup'){
    const s=ui.setupSel;
    if(!s){o.targets=setupHouseSpots(G,pi).map(v=>({k:'v',i:v,b:'house'}))}
    else{o.ghostV=new Map([[s.v,pi*2]]);const geo=geoOf(G.board);
      if(s.e===null)o.targets=geo.verts[s.v].edges.filter(e=>G.er[e]===-1).map(e=>({k:'e',i:e}));
      else{o.ghostE=[s.e];o.ghostP=pi}
      o.targets=(o.targets||[]).concat(s.e===null?[]:[]);
      // tapping another corner moves the house
      if(s.e===null)setupHouseSpots(G,pi).forEach(v=>{if(v!==s.v)o.targets.push({k:'v',i:v,b:'house',faint:1})});
    }
  }else if(mine()&&G.phase==='raider'){
    o.hexT=new Set();G.board.hexes.forEach((h,i)=>{if(i!==G.raider)o.hexT.add(i)});
    ui.targets=targetCoords([...o.hexT].map(i=>({k:'h',i})));
  }else if(ui.act&&ui.act.kind==='build'){
    const st=buildState();
    if(st){o.targets=st.targets;
      o.ghostV=new Map();o.ghostE=[];o.ghostP=pi;ui.act.b.forEach(b=>{if(b.k==='road')o.ghostE.push(b.at);else o.ghostV.set(b.at,pi*2+(b.k==='hall'?1:0))})}
  }else if(ui.act&&ui.act.kind==='raid'){
    o.hexT=new Set();G.board.hexes.forEach((h,i)=>{if(i!==G.raider)o.hexT.add(i)});
    ui.targets=targetCoords([...o.hexT].map(i=>({k:'h',i})));
  }

function offerHTML(o,k,canTake){

/* ---------- family / tableau ---------- */
function nextFeast(){return FEASTS.find(f=>f>G.moon||(f===G.moon&&(G.phase==='work'||G.phase==='raider'||G.phase==='feast')))}
function familyView(pi,inSheet){
  const p=G.players[pi],me=pi===meIdx(),show=me||G.opts.open||G.phase==='end';
  let h='';

  h+=`<div class="statgrid"><div class="stat"><b>${p.kin}</b><small>kin · ${beds(p)} beds</small></div><div class="stat"><b>${p.houses}·${p.halls}</b><small>houses · halls</small></div><div class="stat"><b>${p.roads}</b><small>roads · best ${p.lr}</small></div><div class="stat"><b>${sc.total}</b><small>points${show?'':' seen'}</small></div></div>`;

    else h+=`<div class="feastok">${ic('food')} Feast ${when}: needs ${need} food. ${me?'You have':esc(p.name)+' has'} enough.</div>`;
  }

  h+=`<p class="sub" style="margin-top:6px">Trade rates: ${rates.map((r,g)=>`${r}:1 ${RES[g]}`).join(' · ')}. Eat: grain ${eatRate(p,3)}, wool ${eatRate(p,4)} food.</p>`;
  h+=`<div class="sect">Crafts</div>`;
  h+=p.crafts.length?`<div class="mycrafts">${p.crafts.map(id=>`<div class="mc"><b>${esc(CRAFTS[id].name)}</b> · ${craftPts(G,pi,id)} pt<br><span class="sub">${esc(CRAFTS[id].text)}</span></div>`).join('')}</div>`:'<p class="sub">None yet. Buy them at the Workshop.</p>';
  h+=`<div class="sect">Charters ${show?'':'<span class="tag">secret</span>'}</div>`;

  return h;
}
function charterHTML(id,done,pi,sel){

function feastSheet(){

  h+=`<div class="tline"><span class="lbl">${resIc(3)}Eat 1 grain <small>+${rg} food · have ${p.res[3]}</small></span><button class="btn sm" data-do="eat" data-g="3" ${p.res[3]?'':'disabled'}>Eat</button></div>`;
  h+=`<div class="tline"><span class="lbl">${resIc(4)}Eat 1 wool <small>+${rw} food · have ${p.res[4]}</small></span><button class="btn sm" data-do="eat" data-g="4" ${p.res[4]?'':'disabled'}>Eat</button></div>`;
  for(let g=0;g<5;g++){const r=rateOf(G,pi,g);h+=`<div class="tline"><span class="lbl">${resIc(g)}Trade ${r} ${RES[g]} → 1 food <small>have ${p.res[g]}</small></span><button class="btn sm" data-do="ftrade" data-g="${g}" ${p.res[g]>=r?'':'disabled'}>Trade</button></div>`}

function rulesHTML(){

  <h3>${ic('hex')}Landing</h3><ul><li>Keep 2 or 3 secret charters. Then each player lands a house and a road, twice, in snake order. Your second house gives 1 good from each hex around it.</li><li>The last player to land holds the Helm for moon 1. The first player gets 1 extra food.</li></ul><h3>${ic('kin')}Each moon</h3><ul><li>A new action is added to the board.</li><li><b>Tides:</b> 3 cards flip (2–12). Each hex with a flipped number gives 1 good to every house on its corners, 2 to every hall.</li><li>Take turns placing one kin on an empty action and doing it. One kin per action.</li><li>Before you place, you may trade: 4 for 1 with the supply (harbors 3:1 or 2:1), or offers with players.</li></ul>

  <h3>${ic('craft')}Crafts and charters</h3><ul><li>The Workshop buys a craft: points and a lasting power.</li><li>You start with 2–3 secret <b>charters</b>: link two landmarks with your roads, or reach a goal. Done = points; unfinished = −2.</li></ul>
  <h3>${ic('star')}Score</h3><p>House 1 · Hall 2 · Kin 2 · Crafts · Charters · Longest road (5+) 3 · Hardship −2.</p>

  <g class="waves" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M-104,40 q8,-6 16,0 t16,0"/><path d="M76,-40 q8,-6 16,0 t16,0"/><path d="M70,48 q8,-6 16,0 t16,0"/></g></svg>`;

/* ---------- end of game ---------- */
function endHTML(){
  const rows=G.players.map((p,i)=>({i,p,s:scoreOf(G,i)}));
  const order=rows.slice().sort((a,b)=>b.s.total-a.s.total);
  const w=G.players[G.winner];
  const lines=[['Houses','houses'],['Halls','halls'],['Kin','kin'],['Crafts','crafts'],['Charters','charters'],['Longest road','road'],['Hardship','hard']];
  let t=`<table class="scoretbl"><thead><tr><th></th>${order.map(r=>`<th><span class="pcol" style="${pcv(r.i)}"><i></i>${esc(r.p.name.slice(0,7))}</span></th>`).join('')}</tr></thead><tbody>`;
  lines.forEach(([n,k])=>{t+=`<tr><td>${n}</td>${order.map(r=>`<td>${r.s[k]}</td>`).join('')}</tr>`});
  t+=`<tr class="tot"><td>Total</td>${order.map(r=>`<td class="${r.i===G.winner?'win':''}">${r.s.total}</td>`).join('')}</tr></tbody></table>`;
  let ch='';order.forEach(r=>{const dn=chDone(G,r.i);ch+=`<h3 style="${pcv(r.i)};margin-top:14px">${esc(r.p.name)}'s charters</h3>${r.p.ch.map((id,k)=>charterHTML(id,dn[k])).join('')||'<p class="sub">None.</p>'}`});
  const me=meIdx(),myWin=G.winner===me&&!G.players[me].bot;
  return `<div class="endwrap"><div class="winner"><svg class="crown" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 46 L12 18 L24 32 L32 12 L40 32 L52 18 L56 46 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="46" width="48" height="8" rx="2" fill="var(--gold)" stroke="var(--ink)" stroke-width="2"/></svg>
    <h1>${myWin?'You win!':esc(w.name)+' wins'}</h1><p class="sub">${order[0].s.total} points after ten moons${order[1]?` · ${order[0].s.total-order[1].s.total} ahead of ${esc(order[1].p.name)}`:''}</p></div>
    ${t}${ch}<div class="row" style="margin-top:18px"><button class="btn" data-do="home">${ic('home')}Home</button><button class="btn primary" style="flex:1" data-do="again">${ic('play')}Play again</button></div>
    ${canUndo()?'<div class="row" style="margin-top:8px"><button class="btn sm" data-do="undo">Undo last move</button></div>':''}</div>`;
}

/* ---------- render ---------- */
let renderQueued=false;
function render(){
  if(typeof document==='undefined')return;
  const app=document.getElementById('app');if(!app)return;
  const keep={};let focus=null;
  try{app.querySelectorAll('input[id]').forEach(i=>keep[i.id]=i.value);focus=document.activeElement&&document.activeElement.id}catch(e){}
  let scr=0;try{const sc=app.querySelector('.scroll');if(sc)scr=sc.scrollTop}catch(e){}
  app.innerHTML=paint();
  try{const sc=app.querySelector('.scroll');if(sc&&scr)sc.scrollTop=scr}catch(e){}
  for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id]}
  if(focus){const el=document.getElementById(focus);if(el&&el.tagName==='INPUT')el.focus()}
  notifyTurn();
}
function paint(){
  const out=paint2();ui.sheetDrawn=ui.sheet?ui.sheetDrawnNext:null;ui.toastDrawn=ui.toast;return out;
}
function paint2(){
  const toast=ui.toast?`<div class="toast ${ui.toast!==ui.toastDrawn?'fr':''}" role="status">${esc(ui.toast)}</div>`:'';
  if(!G||ui.screen!=='game')return homeHTML()+sheetHTML()+toast;
  if(G.phase==='end')return endHTML()+sheetHTML()+toast;
  const my=mine();
  // pass-and-play privacy cover
  if(mode==='local'&&humans()>1&&my&&ui.shown!==actorIdx()){
    return `<div class="cover"><div class="wordmark" style="font-size:40px">Strand</div><p>Pass the phone to</p><h1 style="${pcv(actorIdx())};font-size:32px">${esc(actor().name)}</h1><button class="btn primary" data-do="cover" style="min-width:200px">I'm ${esc(actor().name)} — show</button></div>`;
  }
  if(my&&ui.lastTurnSeen!==G.seq+':'+actorIdx()){ui.lastTurnSeen=G.seq+':'+actorIdx();if(ui.wasMine!==true){ui.recapOpen=true}}
  // auto-open what the phase needs
  if(my&&!ui.sheet){
    if(G.phase==='charter'&&!ui.autoCh){ui.autoCh=true;ui.keep=[];ui.sheet='charters'}
    if(G.pend&&ui.pendSeen!==G.seq){ui.pendSeen=G.seq;ui.keep=[];ui.sheet='charters'}
    if(G.phase==='feast'&&ui.feastSeen!==G.moon+':'+actorIdx()){ui.feastSeen=G.moon+':'+actorIdx();ui.sheet='feast'}
    if((G.phase==='setup'||G.phase==='raider')&&ui.view!=='island')ui.view='island';
  }
  if(G.phase!=='charter')ui.autoCh=false;
  if(ui.sheet==='feast'&&(!my||G.phase!=='feast'))ui.sheet=null;
  if(ui.sheet==='charters'&&(!my||(G.phase!=='charter'&&!G.pend)))ui.sheet=null;
  ui.wasMine=my;
  let main='';
  const v=ui.view;
  if(v==='island')main=islandView();else{ui.targets=[];if(v==='board')main=boardView();else if(v==='market')main=marketView();else main=`<div class="scroll">${familyView(meIdx())}</div>`}
  return `<div class="game">${topbarHTML()}${stripHTML()}<main class="main">${recapHTML()}${main}</main>${dockHTML()}${tabsHTML()}</div>${sheetHTML()}${toast}`;
}
function notifyTurn(){
  const m=!!G&&G.phase!=='end'&&mine()&&ui.screen==='game';
  if(m&&!net.lastMine){buzz(140);if(G.phase==='work')SFX.turn()}
  net.lastMine=m;
  try{document.title=m&&mode==='online'?'Your turn · Strand':'Strand'}catch(e){}
}

/* ================= Strand — online play (shared doc games/current) ================= */
const syncErr=e=>e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')?"This phone can't save moves. Ask the owner to share Strand with you as an Editor.":"That didn't sync. Check your connection and try again.";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function commit(){
  if(mode!=='online'||!net.ref||seat()<0)return;
  net.rev++;net.dirty=true;flush();
}
async function flush(){
  if(net.writing||!net.dirty)return;net.writing=true;net.dirty=false;
  const body={status:'play',seats:net.doc.seats.slice(),names:net.doc.names||[],gid:net.gid,rev:net.rev,g:JSON.parse(JSON.stringify(G))};
  try{await net.ref.set(body);net.doc=body}catch(e){
    if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked'))net.canWrite=false;
    flash(syncErr(e));net.dirty=false;
    if(net.doc&&net.doc.g){G=JSON.parse(JSON.stringify(net.doc.g));net.rev=net.doc.rev}
    render();
  }
  net.writing=false;if(net.dirty)flush();
}
async function initNet(){
  try{
    if(typeof window==='undefined'||!window.claude||!window.claude.use){net.off=true;net.ready=true;render();return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?(u=>{if(!u)return u;let d=null;const K="dev_id";for(const s of ["localStorage","sessionStorage"]){try{d=d||window[s].getItem(K)}catch(e){}}if(!d){d=Math.random().toString(36).slice(2,10);for(const s of ["localStorage","sessionStorage"]){try{window[s].setItem(K,d)}catch(e){}}}return u+"~"+d})(await user.id()):null;
    if(!db||!id){net.off=true;net.ready=true;render();return}
    try{net.canWrite=user&&user.can?await user.can('data.write'):null}catch(e){net.canWrite=null}
    net.db=db;net.me=id;net.ref=db.doc('games/current');
    net.ref.onSnapshot(snap=>{net.ready=true;net.doc=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;applyDoc(net.doc);render()},
      ()=>{net.off=true;net.ready=true;if(mode==='online')flash('Lost the connection to the online game. Reload the page to reconnect.');render()});
  }catch(e){net.off=true;net.ready=true;render()}
}
function applyDoc(d){
  const live=d&&d.status==='play'&&d.g&&(d.seats.includes(net.me)||net.watch);
  if(live){
    if(mode!=='online'&&(ui.screen!=='game'||!G)){mode='online';ui.act=null;ui.sel=null;ui.sheet=null;ui.view='board';ui.screen='game';net.rev=-1;net.gid=null;ui.lastFx=d.g.seq}
    if(mode==='online'){
      if(ui.act&&mine())net.pending=d;
      else if(d.gid!==net.gid||d.rev>net.rev||(d.rev===net.rev&&!net.writing&&!net.dirty&&JSON.stringify(d.g)!==JSON.stringify(G))){
        const fromOther=d.rev>net.rev;
        G=JSON.parse(JSON.stringify(d.g));net.gid=d.gid;net.rev=d.rev;
        if(fromOther)net.driver=false;
        if(ui.sel&&!mine())ui.sel=null;if(ui.act&&!mine())ui.act=null;
        fxScan();repairBots();
      }
    }
  }else if(mode==='online'){mode='local';G=null;ui.act=null;ui.sel=null;ui.sheet=null;ui.screen='home';net.watch=false;net.rev=0;net.gid=null;net.driver=false;flash('The online game has ended.')}
}
function repairBots(){
  // The phone that moves runs the computers that follow. If a saved game is ever left on a computer's turn, the lowest-seated person's phone finishes it.
  clearTimeout(net.repairT);
  if(!G||G.phase==='end'||!actor().bot||seat()<0)return;
  const first=net.doc.seats.findIndex((u,i)=>u&&!G.players[i].bot);if(first!==seat())return;
  const rev=net.rev;
  net.repairT=setTimeout(()=>{if(net.rev!==rev||ui.act||!G||!actor().bot)return;net.driver=true;runBots()},4000);
}
async function hostGame(){
  const name=(document.getElementById('hn')?.value||'').trim()||'Player 1';
  const n=ui.setup.op,b=Math.min(ui.setup.ob,5-n);
  const seats=Array(n).fill(null);seats[0]=net.me;const names=Array(n).fill('');names[0]=name;
  try{await net.ref.set({status:'lobby',seats,names,bots:b,rev:0,opts:{calm:prefs.calm,forgive:prefs.forgive,open:prefs.open}})}catch(e){if(e&&e.code==='invalid_argument')net.canWrite=false;flash(syncErr(e));render()}
}
async function joinGame(){
  const name=(document.getElementById('jn')?.value||'').trim()||'Player';
  let ok=false;
  for(let t=0;t<10&&!ok;t++){
    try{const l=await net.ref.acquire({holder:net.me,ttlMs:1500});ok=!!l.acquired}
    catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){net.canWrite=false;render();return}}
    if(!ok)await sleep(400+Math.random()*500);
  }
  if(!ok){flash('Someone else is joining right now. Try again in a moment.');render();return}
  let d;try{const s=await net.ref.get();d=s.exists?JSON.parse(JSON.stringify(s.data())):null}catch(e){flash(syncErr(e));render();return}
  if(!d||d.status!=='lobby'){flash('That game is no longer open.');render();return}
  if(d.seats.includes(net.me))return;
  const i=d.seats.indexOf(null);if(i<0){flash('That game is already full.');render();return}
  d.seats[i]=net.me;d.names[i]=name;
  if(d.seats.every(Boolean)){
    const table=shuffle([...d.names.map((nm,k)=>({name:nm||'Player',uid:d.seats[k]})),...shuffle(BOTNAMES.slice()).slice(0,d.bots||0).map(nm=>({name:nm,bot:true,uid:null}))]);
    G=newGame(table.map(t=>({name:t.name,bot:!!t.bot})),d.opts||{});
    const gid=Math.random().toString(36).slice(2,10);
    const body={status:'play',seats:table.map(t=>t.uid),names:table.map(t=>t.name),gid,rev:1,g:JSON.parse(JSON.stringify(G))};
    mode='online';net.gid=gid;net.rev=1;net.doc=body;net.driver=true;ui.view='island';ui.screen='game';ui.lastFx=G.seq;render();
    try{await net.ref.set(body);runBots()}catch(e){if(e&&e.code==='invalid_argument')net.canWrite=false;else flash(syncErr(e));mode='local';G=null;ui.screen='online';render()}
  }else{
    try{await net.ref.set(d)}catch(e){if(e&&e.code==='invalid_argument')net.canWrite=false;else flash(syncErr(e));render()}
  }
}
function endOnline(){if(net.ref)net.ref.set({status:'idle',rev:0}).catch(e=>{flash(syncErr(e));render()});net.driver=false}
function handToComputer(i){
  if(mode!=='online'||!G||i===seat())return;
  const p=G.players[i];if(p.bot)return;
  p.bot=true;p.away=net.doc.seats[i]||'x';ui.sheet=null;
  log(G,i,`${p.name}'s seat is handed to a computer for now.`);
  net.driver=true;commit();render();runBots();
}
function takeSeatBack(){
  const i=seat();if(i<0||!G)return;const p=G.players[i];if(!p.bot||!p.away)return;
  p.bot=false;delete p.away;log(G,i,`${p.name} takes their seat back.`);
  clearTimeout(ui.botTimer);ui.botTimer=null;ui.busy=false;
  commit();flash('Your seat is back. If a computer was mid-move, tap again if it did not stick.');render();
}
function onlineBox(){
  let inner;
  if(!net.ready)inner='<p class="sub">Connecting…</p>';
  else if(net.off)inner='<p class="sub">Online play is not available right now. Check your internet connection, then reload.</p>';
  else{
    const d=net.doc,st=d&&d.status,S=ui.setup;
    const noWrite=net.canWrite===false?`<div class="box"><b>This phone can watch but can't join.</b><p class="sub">The owner needs to open Share, turn off "Anyone with the link", and invite you by email as an Editor, then reload.</p></div>`:'';
    if(noWrite&&st!=='play')inner=(st==='lobby'?`<p><b>${esc(d.names[0]||'Someone')}</b> is hosting a game.</p>`:'')+noWrite;
    else if(st==='lobby'){
      const joined=d.seats.filter(Boolean).length,need=d.seats.length,bots=d.bots||0;
      const roster=d.seats.map((u,i)=>u?esc(d.names[i]||'Player'):'open seat').join(', ')+(bots?`, ${bots} computer${bots>1?'s':''}`:'');
      if(d.seats.includes(net.me))inner=`<p><b>Waiting for players.</b> ${joined} of ${need} people have joined.</p><p class="sub">${roster}</p><p class="sub">Others open Strand on their phones, with the same table code, and tap Join.</p>${d.seats[0]===net.me?'<button class="btn" data-do="cancelHost">Cancel game</button>':''}`;
      else inner=`<p><b>${esc(d.names[0]||'Someone')}</b> is hosting a game. ${joined} of ${need} people have joined.</p><p class="sub">${roster}</p><label class="field" for="jn">Your name<input id="jn" placeholder="Player" maxlength="14" autocomplete="off"></label><button class="btn primary wide" data-do="join" style="margin-top:10px">Join game</button>`;
    }
    else if(st==='play'&&d.g)inner=`<p>${d.g.players.map(p=>esc(p.name)).join(', ')} are playing, moon ${d.g.moon}.</p>${d.seats.includes(net.me)?'':'<div class="row"><button class="btn" data-do="watch">Watch</button><button class="btn" data-do="newgame">End it and start over</button></div>'}`;
    else inner=`<label class="field" for="hn">Your name<input id="hn" placeholder="Player 1" maxlength="14" autocomplete="off"></label>
      <div class="pick"><span>People, including you</span>${seg('op',[2,3,4,5],S.op)}</div>
      <div class="pick"><span>Computer players</span>${seg('ob',[0,1,2,3],S.ob,v=>S.op+v>5)}</div>
      <button class="btn primary wide" data-do="host" style="margin-top:12px">Host a game</button><p class="sub" style="margin-top:8px">Then each other person opens this page on their phone and taps Join. Seats are drawn at random. House rules from Settings apply.</p>`;
  }
  return `<section class="box"><h2>Each on their own phone</h2>${inner}</section>`;
}

/* ---------- boot ---------- */
function start(data){
  if(data&&data.G&&data.G.v===2){G=data.G;mode='local';ui.screen='game';ui.view='board';ui.lastFx=G.seq}else ui.screen='home';
  render();initNet();if(G)runBots();
}
if(typeof window!=='undefined'&&typeof document!=='undefined'&&document.getElementById('app')){
  const boot=()=>{try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>mode==='local'&&G?{G}:{})}catch(e){}
    if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start(null)};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
}
