<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/tempo-180.png"><link rel="icon" type="image/png" href="../icons/tempo-192.png"><meta name="apple-mobile-web-app-title" content="Tempo"><meta name="mobile-web-app-capable" content="yes"><script src="../config.js"></script><script src="../shim.js" data-game="tempo"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Tempo: chess for two, face to face on one phone, on two phones, or against the computer.">
<title>Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
/* Tempo — a club-room chess set: felt green, brass fittings, ivory and ebony pieces.
   Layout: one phone column. Home is a stack of mode rows; play is a fixed top bar, two player cards
   around an edge-to-edge board, a move ribbon and a bottom action bar. */
:root{
  --bg:#e6ebe3; --surface:#f4f7f1; --raised:#ffffff; --ink:#14201a; --muted:#56655c; --line:#cdd7c9; --line2:#dde4d8;
  --accent:#1d5a43; --accent-ink:#f3f8f4; --accent-soft:#d3e5d9; --brass:#9c7016; --brass-soft:#f0e3c2;
  --danger:#ad3626; --danger-soft:#f5dbd5; --scrim:rgba(14,22,18,.42); --shadow:0 1px 2px rgba(20,33,26,.08),0 8px 24px rgba(20,33,26,.10);
  --pw-fill:#fbf8f0; --pw-fill2:#e6dfcf; --pw-line:#1e2227; --pb-fill:#2b2e35; --pb-fill2:#474d59; --pb-line:#0b0d10; --pb-detail:#ece6d9;
  --sq-l:#e9e4d2; --sq-d:#7f9c78; --sq-last:rgba(222,178,52,.48); --sq-sel:rgba(29,90,67,.42); --sq-dot:rgba(16,30,22,.30); --sq-check:#e0523c; --sq-hint:#2d6fe0; --caps-edge:#0b0d10;
  --f-display:'Young Serif',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --bsize:min(100vw,520px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c120f; --surface:#141c18; --raised:#1b2520; --ink:#e3e9e1; --muted:#95a39a; --line:#2a3630; --line2:#212b26;
  --accent:#6dc8a0; --accent-ink:#0a1510; --accent-soft:#1b392c; --brass:#dcae4e; --brass-soft:#372d1b;
  --danger:#f08270; --danger-soft:#3c201b; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --sq-dot:rgba(10,20,14,.36); --caps-edge:#8d9a92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c120f; --surface:#141c18; --raised:#1b2520; --ink:#e3e9e1; --muted:#95a39a; --line:#2a3630; --line2:#212b26;
  --accent:#6dc8a0; --accent-ink:#0a1510; --accent-soft:#1b392c; --brass:#dcae4e; --brass-soft:#372d1b;
  --danger:#f08270; --danger-soft:#3c201b; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --sq-dot:rgba(10,20,14,.36); --caps-edge:#8d9a92; color-scheme:dark}
[data-board="walnut"]{--sq-l:#ecd8b8;--sq-d:#a9784f;--sq-last:rgba(240,196,70,.5);--sq-sel:rgba(80,50,20,.38)}
[data-board="harbor"]{--sq-l:#dfe6ea;--sq-d:#7b95aa;--sq-last:rgba(246,206,82,.5);--sq-sel:rgba(30,60,90,.38)}
[data-board="slate"]{--sq-l:#d9dad4;--sq-d:#8b908a;--sq-last:rgba(232,190,64,.5);--sq-sel:rgba(40,44,40,.36)}
[data-board="blossom"]{--sq-l:#f3e2dc;--sq-d:#c98f8a;--sq-last:rgba(250,206,90,.55);--sq-sel:rgba(110,40,50,.34)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--ink)}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
#view{height:100%}
.scr{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--line2)}
.ib svg{width:24px;height:24px}
.hbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 6px}
.hbar h2{margin:0;font:400 20px/1.2 var(--f-display);letter-spacing:.01em}

/* ---------- home ---------- */
.brand{padding:4px 20px 18px}
.brand h1{font:400 64px/0.95 var(--f-display);margin:0;letter-spacing:-.01em;color:var(--ink)}
.brand h1 span{color:var(--accent)}
.brand p{margin:10px 0 0;color:var(--muted);font-size:16px;max-width:30ch}
.cont{display:flex;gap:14px;align-items:center;width:100%;border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:12px;text-align:left;box-shadow:var(--shadow);margin-bottom:14px}
.cont .mini{width:96px;flex:none}
.cont b{display:block;font:400 19px/1.2 var(--f-display)}
.cont span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.cont .go{margin-left:auto;color:var(--accent);flex:none}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left}
.mode:active,.cont:active{transform:scale(.99)}
.mode .mi{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.mode .mi svg{width:38px;height:38px}
.mode b{display:block;font-weight:700;font-size:16.5px}
.mode small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.mode .chev{margin-left:auto;color:var(--muted);flex:none}
.foot{display:flex;gap:10px;margin-top:14px}
.home .scroll{display:flex;flex-direction:column;padding-bottom:0}
.edge{margin:22px -16px 0;margin-top:auto;padding-top:22px;position:relative}
.edge .rowb{display:grid;grid-template-columns:repeat(8,1fr)}
.edge .rowb i{aspect-ratio:1;background:var(--sq-l);position:relative}
.edge .rowb i.d{background:var(--sq-d)}
.edge .rowb i svg{position:absolute;inset:4%;width:92%;height:92%}
.edge::after{content:"";position:absolute;left:0;right:0;top:22px;height:40%;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.foot button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600}
.mini-board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.mini-board i{background:var(--sq-l);position:relative}
.mini-board i.d{background:var(--sq-d)}
.mini-board i svg{position:absolute;inset:0;width:100%;height:100%}

/* ---------- forms / setup ---------- */
.sec{margin-top:18px}
.sec>label,.sec>.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px}
.field{width:100%;min-height:48px;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:0 14px;font-size:16px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14.5px;color:var(--muted);padding:0 4px}
.seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4}
.levels{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.levels button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--raised);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.levels button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lvl-desc{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line2)}
.lvl-desc b{font:400 18px/1.2 var(--f-display)}
.lvl-desc p{margin:3px 0 0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:36px;border-radius:18px;border:1px solid var(--line);background:transparent;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip.on::before{background:var(--accent);border-color:var(--accent)}
.prow{display:flex;gap:10px;align-items:center}
.prow .swatch{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center}
.prow .swatch svg{width:30px;height:30px}
.note{color:var(--muted);font-size:13.5px;margin:8px 2px 0}
.bottom{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);background:var(--bg)}
.btn{min-height:50px;border-radius:13px;border:1px solid var(--line);background:var(--raised);font-weight:700;font-size:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.box{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;margin-top:14px}
.box p{margin:0 0 10px}
.box .sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--ink)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- game ---------- */
.game .top{display:flex;align-items:center;min-height:52px;padding:0 4px;gap:2px}
.status{flex:1;text-align:center;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pcard{display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 12px;position:relative;transition:background .2s}
.pcard.turn{background:linear-gradient(90deg,var(--accent-soft),transparent 80%)}
.pcard.turn::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.pcard.flip{transform:rotate(180deg)}
.pcard.flip.turn{background:linear-gradient(90deg,var(--accent-soft),transparent 80%)}
.av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--sq-l)}
.av svg{width:34px;height:34px}
.pinfo{min-width:0;flex:1}
.pname{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:18px;white-space:nowrap}
.caps{display:flex;align-items:center;height:18px}
.caps svg{width:17px;height:17px;margin-right:-6px}
.caps .gap{width:9px}
.caps .pc-svg.b .b,.caps .pc-svg.b .c{stroke:var(--caps-edge)}
.caps b{margin-left:9px;font-size:12px;color:var(--muted)}
.dot-on{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot-off{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5}
.clock{font:700 20px/1 var(--f-body);font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:10px;background:var(--line2);min-width:76px;text-align:center;flex:none}
.clock.run{background:var(--ink);color:var(--bg)}
.clock.low{background:var(--danger);color:#fff}
.bwrap{position:relative;width:var(--bsize);height:var(--bsize);margin:0 auto;flex:none}
.stage .pcard{flex:none}

/* board */
.board{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;contain:layout}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.sq.last::after,.sq.sel::after{content:"";position:absolute;inset:0;background:var(--sq-last)}
.sq.sel::after{background:var(--sq-sel)}
.sq.chk{background-image:radial-gradient(circle,var(--sq-check) 0%,rgba(224,82,60,.55) 40%,transparent 72%)}
.sq.tgt::before{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:var(--sq-dot);z-index:1}
.sq.tgt.cap::before{width:92%;height:92%;margin:-46% 0 0 -46%;background:transparent;border:5px solid var(--sq-dot)}
.sq.hov{box-shadow:inset 0 0 0 4px rgba(255,255,255,.7)}
.sq .cf,.sq .cr{position:absolute;font-size:10.5px;font-weight:700;line-height:1;pointer-events:none;color:var(--sq-d);opacity:.95}
.sq.d .cf,.sq.d .cr{color:var(--sq-l)}
.sq .cf{right:3px;bottom:2px}
.sq .cr{left:3px;top:3px}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;will-change:transform;transition:transform .19s cubic-bezier(.3,.7,.3,1),opacity .19s}
.pc.noanim{transition:none}
.pc.drag{z-index:20;transition:none}
.pc.drag svg{transform:scale(1.22) translateY(-14%)}
.pc.gone{opacity:0}
.pc svg{width:100%;height:100%;display:block;transition:transform .12s}
.pc svg.rot{transform:rotate(180deg)}
.pc.drag svg.rot{transform:rotate(180deg) scale(1.22) translateY(-14%)}
.pc-svg .b{stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.pc-svg .c{stroke-width:1.5;stroke-linejoin:round}
.pc-svg .d{fill:none;stroke-width:1.3;stroke-linecap:round}
.pc-svg.w .b{fill:var(--pw-fill);stroke:var(--pw-line)}.pc-svg.w .c{fill:var(--pw-fill2);stroke:var(--pw-line)}.pc-svg.w .d{stroke:var(--pw-line)}.pc-svg.w .e{fill:var(--pw-line)}
.pc-svg.b .b{fill:var(--pb-fill);stroke:var(--pb-line)}.pc-svg.b .c{fill:var(--pb-fill2);stroke:var(--pb-line)}.pc-svg.b .d{stroke:var(--pb-detail)}.pc-svg.b .e{fill:var(--pb-detail)}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.mark{position:absolute;width:12.5%;height:12.5%;pointer-events:none;z-index:16}
.mark b{position:absolute;right:-2px;top:-2px;min-width:22px;height:22px;border-radius:11px;font-size:12px;font-weight:800;display:grid;place-items:center;color:#fff;background:var(--danger);box-shadow:0 1px 3px rgba(0,0,0,.3);padding:0 4px}
.mark b.m{background:#d98a1c}
.promo{position:absolute;inset:0;z-index:30;background:rgba(10,16,13,.35)}
.promo .col{position:absolute;width:12.5%;display:flex;flex-direction:column;background:var(--raised);box-shadow:0 8px 30px rgba(0,0,0,.4);border-radius:10px;overflow:hidden}
.promo .col button{border:0;background:transparent;aspect-ratio:1;padding:2px}
.promo .col button:active{background:var(--accent-soft)}
.promo .col button svg{width:100%;height:100%}
.promo .col button.x{aspect-ratio:auto;height:30px;font-size:18px;color:var(--muted);background:var(--line2)}
.result{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:rgba(10,16,13,.28);animation:fade .25s}
.rcard{position:relative;background:var(--raised);border-radius:18px;padding:20px 20px 16px;width:min(86%,320px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.rcard small{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.rcard h3{font:400 30px/1.1 var(--f-display);margin:6px 0 4px}
.rcard p{margin:0 0 14px;color:var(--muted);font-size:14px}
.rcard .x{position:absolute;right:6px;top:6px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.ribbon{display:flex;gap:2px;overflow-x:auto;padding:6px 10px;min-height:44px;align-items:center;scrollbar-width:none;border-top:1px solid var(--line2)}
.ribbon::-webkit-scrollbar{display:none}
.ribbon .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;padding:0 2px 0 8px}
.ribbon .m{border:0;background:transparent;border-radius:8px;padding:5px 7px;font-weight:600;font-size:14.5px;white-space:nowrap}
.ribbon .m.cur{background:var(--accent-soft)}
.ribbon .empty{color:var(--muted);font-size:13.5px;padding-left:6px}
.ribbon .q2{color:var(--danger)}.ribbon .q1{color:#c87a10}
.actions{display:flex;justify-content:space-around;padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);background:var(--surface)}
.act{flex:1;max-width:96px;min-height:56px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink)}
.act svg{width:24px;height:24px}
.act:disabled{opacity:.35}
.act:active:not(:disabled){background:var(--line2)}
.act.hot{color:var(--accent)}
.hintbar{flex:1;padding:6px 4px 6px 10px;border-radius:12px;background:var(--brass-soft);display:flex;gap:10px;align-items:center;font-size:14.5px;animation:fade .2s}
.hintbar b{font-weight:800}
.hintbar>svg{width:22px;height:22px;flex:none;color:var(--brass)}
.review .stage{flex:none}
.review .ribbon{margin-top:auto}
.hintbar .ib{width:36px;height:36px;margin-left:auto}
.think{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.think i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}

/* review */
.graph{display:block;width:100%;height:70px;margin:2px 0 6px;touch-action:none}
.rinfo{margin:8px 12px 0;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);font-size:14.5px;min-height:62px}
.rinfo .tag{font-weight:800}
.rinfo .tag.q2{color:var(--danger)}.rinfo .tag.q1{color:#c87a10}.rinfo .tag.ok{color:var(--accent)}
.rsum{display:flex;gap:8px;margin:8px 12px 0;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* sheets, prompts, toasts */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50;animation:fade .2s;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.sheet h3{font:400 24px/1.2 var(--f-display);margin:4px 0 10px}
.sheet h4{margin:18px 0 6px;font-size:15px}
.sheet p{margin:0 0 10px}
.sheet .list{display:grid;gap:8px}
.sheet .item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;text-align:left;font-weight:600;font-size:15.5px}
.sheet .item svg{width:22px;height:22px;flex:none}
.sheet .item.danger{color:var(--danger)}
.sheet .item .val{margin-left:auto;color:var(--muted);font-weight:500}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.center{align-items:center;justify-content:center;padding:16px}

/* score every root move with a full-window search to `d` plies (multi-PV for weak levels) */
function rootScores(d,qsOn){

function softPick(arr,T,rand){
  let mx=-INF;for(const a of arr)if(a.s>mx)mx=a.s;
  if(T<=0)return arr.find(a=>a.s===mx).m;
  let tot=0;const w=arr.map(a=>{const x=Math.exp(Math.max(-30,(a.s-mx)/T));tot+=x;return x});
  let r=rand()*tot;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i].m}
  return arr[arr.length-1].m;
}

  o=o||{};const lv=o.spec||LEVELS[o.level||LEVELS.length-1],t0=now(),scale=o.timeScale||1;
  if(o.seed!=null)rs=(o.seed>>>0)||1;

  let r;

    const m=softPick(arr,T,rand);r={move:m,score:arr.find(a=>a.m===m).s,depth:lv.d,nodes};
  }else if(lv.bl&&rand()<lv.bl){
    const arr=rootScores(1,false);const m=softPick(arr,lv.bt||75,rand);r={move:m,score:arr.find(a=>a.m===m).s,depth:1,nodes};

}

/* best SEE gain the side NOT to move could make right now (by a null move), optionally restricted to captures on one square */
function threatGain(onSq){
  makeNull();const base=LBASE,e=gen(base,true);let best=0,bsq=-1;
  for(let i=base;i<e;i++){const m=MV[i],to=(m>>7)&127;if(onSq>=0&&to!==onSq)continue;if(!make(m))continue;unmake();const g=see(m);if(g>best){best=g;bsq=to}}

/* does move m leave material hanging or allow mate in one? */
function hangCheck(m){

  const got=(fl&CAP)?SV[(fl&EPF)?PAWN:board[to]&7]:0;const prom=pr?SV[pr]-100:0;
  if(!make(m))return null;
  const replies=legalMoves();
  if(!replies.length){unmake();return null}
  for(const r of replies){make(r);const mated=inCheck()&&legalMoves().length===0;unmake();if(mated){const u=uci(r);unmake();return{kind:'mate',reply:u}}}
  const base=LBASE,e=gen(base,true);let best=0,bsq=-1,bm=0;
  for(let i=base;i<e;i++){const c=MV[i];if(!make(c))continue;unmake();const g=see(c);if(g>best){best=g;bsq=(c>>7)&127;bm=c}}
  const piece=bsq>=0?board[bsq]&7:0;
  unmake();
  const net=got+prom-best;
  if(net<=-200&&piece)return{kind:'hang',piece:PNAME[piece],sq:sqName(bsq),loss:-net};
  return null;
}
function explain(m,score){
  const from=m&127,to=(m>>7)&127,fl=m>>>17,pr=(m>>14)&7,t=board[from]&7,us=side;
  if(score!=null&&score>MATE-200){const n=Math.ceil((MATE-score)/2);if(n<=1)return 'checkmate!';return 'leads to checkmate in '+n}
  if(fl&CAS)return 'gets your king to safety';
  const before=threatGain(from).gain;
  let capV=0;if(fl&CAP)capV=(fl&EPF)?PAWN:board[to]&7;
  const g=(fl&CAP)?see(m):0;
  make(m);const chk=inCheck();
  /* what does the moved piece attack now? */
  let forks=0;const pv=SV[pr||t];
  const D=t===KNIGHT?ND:t===KING?KD:t===BISHOP?BD:t===ROOK?RD:t===QUEEN?KD:null;
  let biggest=0;
  if(t===PAWN){for(const d of us?[-15,-17]:[15,17]){const s=to+d;if(s&0x88)continue;const p=board[s];if(p&&(p>>3)!==us&&(p&7)!==PAWN){forks++;if((p&7)>biggest)biggest=p&7}}}
  else if(D){const slide=t!==KNIGHT&&t!==KING,nd=t===BISHOP||t===ROOK?4:8;
    for(let i=0;i<nd;i++){let s=to+D[i];while(!(s&0x88)){const p=board[s];if(p){if((p>>3)!==us&&((p&7)===KING||SV[p&7]>pv||!attacked(s,us^1))){forks++;if((p&7)!==KING&&(p&7)>biggest)biggest=p&7}break}if(!slide)break;s+=D[i]}}}
  const after=threatGain(-1);
  const safeNow=!attacked(to,us^1)||threatGain(to).gain<=0;
  unmake();
  if(pr===QUEEN)return 'makes a new queen';
  if(capV&&g>=SV[capV]-20)return 'wins the '+PNAME[capV]+(chk?' with check':'');
  if(capV&&g>0)return 'wins material';
  if(forks>=2&&safeNow)return chk?'checks and attacks another piece':'attacks two pieces at once';
  if(before>=100&&safeNow&&after.gain<100)return 'saves your '+PNAME[t];
  if(capV&&g===0)return 'trades the '+PNAME[capV];
  if(chk)return 'puts the king in check';
  if(biggest&&safeNow)return 'attacks the '+PNAME[biggest];
  {const tb=threatGain(-1);if(after.gain<100&&tb.gain>=100&&tb.sq>=0&&board[tb.sq])return 'protects your '+PNAME[board[tb.sq]&7]+' on '+sqName(tb.sq)}
  const r=to>>4,fr=from>>4;
  if((t===KNIGHT||t===BISHOP)&&(fr===(us?7:0)))return 'develops a piece';
  if(t===PAWN&&((to&7)===3||(to&7)===4))return 'takes space in the center';
  if(t===ROOK&&!hasPawnOnFile(to&7))return 'puts the rook on an open file';
  return 'improves your position';
}

/* ---------- engine worker ---------- */
function workerMain(){
  const E=makeEngine();
  self.onmessage=function(e){
    const d=e.data;let r;
    try{
      E.load(d.fen,d.moves);
      if(d.cmd==='go'){r=E.think(d.opts||{});r.pv=null}
      else{const g=E.go({timeMs:d.ms||150,full:true});r={score:g.score,uci:g.move?E.uci(g.move):null,depth:g.depth}}

}
const Eng={w:null,id:0,cb:new Map(),local:null};
function engStart(){
  try{
    const src=makeEngine.toString()+'\n('+workerMain.toString()+')();';
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    Eng.w=new Worker(url);

  }catch(e){Eng.w=null}
}
function engAsk(msg){
  return new Promise(res=>{
    const id=++Eng.id;msg.id=id;
    if(Eng.w){Eng.cb.set(id,res);Eng.w.postMessage(msg);return}
    /* fallback: search on the main thread with a short budget */
    setTimeout(()=>{
      if(!Eng.local)Eng.local=makeEngine();const E=Eng.local;let r;
      try{E.load(msg.fen,msg.moves);if(msg.cmd==='go'){r=E.think(Object.assign({},msg.opts,{timeScale:.35}))}else{const g=E.go({timeMs:Math.min(80,msg.ms||80),full:true});r={score:g.score,uci:g.move?E.uci(g.move):null}}}catch(e){r={error:String(e)}}
      res(r);
    },30);
  });
}
function engCancel(){if(Eng.w&&Eng.cb.size){Eng.w.terminate();for(const f of Eng.cb.values())f({cancelled:true});Eng.cb.clear();engStart()}}

  ui.sel=-1;ui.targets=[];ui.hint=null;ui.promo=null;ui.warn=null;
  if(G.mode==='online'){if(G.offer&&G.offer.by!==c)G.offer=null;G.answered=null}
  const st=R.status();if(st.over){G.result={result:st.result,reason:st.reason}}
  if(st.over)sfx('end');else if(R.inCheck())sfx('check');else if(cap)sfx('capture');else sfx('move');
  if(G.mode==='online'){net.localStart=Date.now();net.seenMoves=G.moves.length}
  persist();
  ui.banner=true;
  render({anim:!o.dragged});
  if(G.mode==='local'&&G.view==='flip'&&!st.over)setTimeout(()=>{ui.holdFlip=null;if(ui.screen==='game')render({anim:false})},540);
  maybeCpu();
}

/* ---------- computer turns ---------- */
function maybeCpu(){
  if(!G||G.mode!=='cpu'||isOver()||ui.thinking)return;
  const p=G.players[R.side];if(p.kind!=='cpu')return;
  ui.thinking=true;const id=G.id,ply=G.moves.length,t0=Date.now();
  if(ui.screen==='game')renderGameParts();
  engAsk({cmd:'go',fen:G.start,moves:G.moves.slice(),opts:{level:p.level,hist:G.start===R.START?G.moves.slice():null}}).then(r=>{
    if(r.cancelled)return;
    const wait=Math.max(0,(p.level<=5?520+Math.random()*380:220)-(Date.now()-t0));
    setTimeout(()=>{
      if(!G||G.id!==id||G.moves.length!==ply||isOver()){ui.thinking=false;return}
      ui.thinking=false;
      const m=r.uci&&R.parseUci(r.uci);
      if(m)commitMove(m,{});else render();
    },wait);
  });
}

/* ---------- hints & coaching ---------- */
async function doHint(){
  if(!G||ui.hintBusy||!canMoveNow())return;
  ui.hintBusy=true;ui.hint=null;renderGameParts();
  const id=G.id,ply=G.moves.length;
  const r=await engAsk({cmd:'go',fen:G.start,moves:G.moves.slice(),opts:{level:8,timeScale:.55,noBook:true}});
  ui.hintBusy=false;
  if(!G||G.id!==id||G.moves.length!==ply||r.error||r.cancelled||!r.uci){renderGameParts();return}
  const m=R.parseUci(r.uci);if(!m){renderGameParts();return}
  ui.hint={from:R.from(m),to:R.to(m),san:R.san(m),why:R.explain(m,r.score)};
  render();
}

/* ---------- takebacks ---------- */
function lastMover(){return G.moves.length?(R.side^1):-1}
function canUndo(){
  if(!G||!G.moves.length||ui.screen!=='game')return false;
  if(G.mode==='local'){return helpers(G.players[lastMover()].name).takeback}
  if(G.mode==='cpu'){const hc=humanColor();if(!helpers(G.players[hc].name).takeback)return false;
    /* need at least one human move to undo */
    const humanMoves=G.moves.filter((_,i)=>((i+(G.start.split(' ')[1]==='b'?1:0))%2)===hc).length;return humanMoves>0}
  if(G.mode==='online')return onlineCanAskUndo();
  return false;
}
function doUndo(){
  if(!canUndo())return;
  if(G.mode==='online'){onlineAskUndo();return}
  engCancel();ui.thinking=false;
  if(G.mode==='local')popPlies(1);
  else{const hc=humanColor();popPlies(1);while(G.moves.length&&R.side!==hc)popPlies(1)}
  G.result=null;ui.hint=null;ui.sel=-1;ui.targets=[];ui.warn=null;
  if(G.clock)G.clock.at=Date.now();
  sfx('move');persist();render();maybeCpu();
}
function popPlies(n){G.moves.splice(-n);G.sans.splice(-n);syncR()}

/* ---------- starting games ---------- */
function startCpu(){
  const s=ui.setup,name=(prefs.names.me||'').trim()||'You';
  const hc=s.color==='r'?(Math.random()<.5?0:1):(s.color==='b'?1:0);
  const human={name,kind:'human'},cpu={name:'Computer',kind:'cpu',level:s.level};
  const players=hc===0?[human,cpu]:[cpu,human];
  const odds=s.odds!=='none'?{by:1-hc,piece:s.odds}:null;
  G=newGame({mode:'cpu',players,start:oddsFen(odds?odds.by:-1,s.odds),clock:makeClock(s.clock,-1,1),odds});
  G.lv2=1;G.adapt=!!s.adapt;

}
function startLocal(){
  const s=ui.setup;const wn=(prefs.names.w||'').trim()||'White',bn=(prefs.names.b||'').trim()||'Black';
  const players=[{name:wn,kind:'human'},{name:bn,kind:'human'}];

  const tBy=s.oddsBy==='w'?0:1;
  G=newGame({mode:'local',players,start:oddsFen(by,s.odds),clock:makeClock(s.clock,tBy,s.timeOdds),view:s.view,odds:by>=0?{by,piece:s.odds}:null});

}
function rematch(){
  if(!G)return;
  if(G.mode==='online'){onlineRematch();return}
  const old=G;const players=[old.players[1],old.players[0]];
  let start=old.start,odds=old.odds;
  if(odds){odds={by:1-odds.by,piece:odds.piece};start=oddsFen(odds.by,odds.piece)}
  let clock=null;if(old.clock){clock={base:[old.clock.base[1],old.clock.base[0]],inc:old.clock.inc,left:[old.clock.base[1],old.clock.base[0]],at:0}}
  G=newGame({mode:old.mode,players,start,clock,view:old.view,odds});
  if(old.mode==='cpu'){G.lv2=1;G.adapt=old.adapt;if(old.adapt)G.players.forEach(p=>{if(p.kind==='cpu')p.level=ui.setup.level})}
  enterGame();
}
function enterGame(){

/* ---------- orientation ---------- */
function boardFlipped(){
  if(!G)return false;let f=false;
  if(G.mode==='cpu')f=humanColor()===1;
  else if(G.mode==='online')f=myColor()===1;
  else if(G.view==='flip'){f=R.side===1&&!isOver();if(ui.holdFlip&&Date.now()<ui.holdFlip.until)f=ui.holdFlip.v}
  return ui.flip?!f:f;
}

  if(!G||G.mode!=='local'||G.view!=='rotate')return null;

}

/* ---------- material ---------- */
const PV={P:1,N:3,B:3,R:5,Q:9,K:0};
function material(pos){
  const cnt={w:{},b:{}};for(const c of pos)if(c)cnt[c[0]][c[1]]=(cnt[c[0]][c[1]]||0)+1;
  R.setFen(G.start);const st={w:{},b:{}};for(let s=0;s<64;s++){const p=R.pieceAt(s);if(p){const c=p<8?'w':'b',t=' PNBRQK'[p&7];st[c][t]=(st[c][t]||0)+1}}
  syncR();
  const lost={w:[],b:[]};let sum={w:0,b:0};
  for(const c of ['w','b']){for(const t of 'QRBNP'){const n=Math.max(0,(st[c][t]||0)-(cnt[c][t]||0));for(let i=0;i<n;i++)lost[c].push(t)}
    for(const t in cnt[c])sum[c]+=PV[t]*cnt[c][t]}
  return{lost,diff:sum.w-sum.b};
}

function toast(msg,ms){ui.toast={msg,until:Date.now()+(ms||2600)};renderOverlay();setTimeout(()=>{if(ui.toast&&Date.now()>=ui.toast.until){ui.toast=null;renderOverlay()}},(ms||2600)+30)}
function seg(key,opts,cur,dis){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-do="set" data-k="${key}" data-v="${v}" class="${String(cur)===String(v)?'on':''}" ${dis&&dis(v)?'disabled':''}>${l}</button>`).join('')}</div>`}
function chipsFor(name){const h=helpers(name);return `<div class="chips">${HELPERS.map(([k,l])=>`<button class="chip ${h[k]?'on':''}" data-do="helper" data-n="${esc(name)}" data-k="${k}" aria-pressed="${h[k]}">${l}</button>`).join('')}</div>`}

function statusText(){
  const r=effResult();

  const chk=R.inCheck()?' · Check!':'';const stm=R.side;
  if(G.mode==='cpu'){if(G.players[stm].kind==='cpu')return `Computer is thinking${chk}`;return `Your move${chk}`}

}
function resultTitle(r){
  const win=r.result==='1-0'?0:r.result==='0-1'?1:-1;
  const reasonText={checkmate:'Checkmate',stalemate:'Stalemate','insufficient material':'Not enough pieces to checkmate','50-move rule':'50 moves without a capture or pawn move','threefold repetition':'Same position three times',agreement:'Draw agreed',resignation:'Resigned',time:'Out of time','time vs insufficient material':'Time ran out, but no mating material'}[r.reason]||r.reason;
  let head;
  if(win<0)head='Draw';
  else{const me=G.mode==='cpu'?humanColor():G.mode==='online'?myColor():-1;
    if(me>=0)head=win===me?'You win!':(G.mode==='cpu'?'Computer wins':`${G.players[win].name} wins`);
    else head=`${G.players[win].name} wins`}
  let sub=reasonText;
  if(r.reason==='checkmate'){const last=G.sans[G.sans.length-1]||'';sub=`${last} after ${Math.ceil(G.sans.length/2)} moves`}
  if(r.reason==='resignation'&&win>=0)sub=`${G.players[1-win].name} resigned`;
  if(r.reason==='time'&&win>=0)sub=`${G.players[1-win].name} ran out of time`;
  return{head:esc(head),sub,label:r.reason==='checkmate'?'Checkmate':win<0?'Draw':r.reason==='resignation'?'Resignation':r.reason==='time'?'On time':'Game over'};
}

  ${P('B',['Bishop','moves any distance diagonally, so it stays on one colour.'])}

  <h4>Castling</h4><p>Once per game, move the king two squares toward a rook, and the rook jumps over to the other side. Only if neither piece has moved, the squares between are empty, and the king is not in check and does not pass through or land on an attacked square. In Tempo, move the king two squares and the rook follows.</p>
  <h4>Promotion</h4><p>A pawn that reaches the far side becomes a queen, rook, bishop or knight. You pick.</p>
  <h4>En passant</h4><p>If a pawn moves two squares and lands beside an enemy pawn, that pawn may capture it as if it had moved one square. Only on the very next move.</p>
  <h4>Draws</h4><p>The game is drawn by stalemate (no legal move but not in check), the same position three times, 50 moves each without a capture or pawn move, too few pieces to checkmate, or when both players agree.</p>

  </div>`;
}

const MATE=R.MATE;
function cpOf(s){if(s==null)return null;if(s>MATE-500)return 2000;if(s<-MATE+500)return -2000;return Math.max(-2000,Math.min(2000,s))}
const wp=cp=>1/(1+Math.pow(10,-cp/400));
function reviewData(){
  if(!G.review||G.review.gid!==G.id||G.review.n!==G.moves.length)G.review={gid:G.id,n:G.moves.length,sc:[],best:[]};
  return G.review;
}
function stmAt(i){const off=G.start.split(' ')[1]==='b'?1:0;return (i+off)%2}
function reviewMarks(){
  const rv=reviewData(),out=[];
  for(let i=0;i<G.moves.length;i++){
    const a=rv.sc[i],b=rv.sc[i+1];if(a==null||b==null){out.push(null);continue}
    const before=cpOf(a),after=-cpOf(b),drop=wp(before)-wp(after);
    let q=null;if(rv.best[i]&&rv.best[i]!==G.moves[i]){if(drop>=.25)q='??';else if(drop>=.12)q='?'}
    out.push({q,drop,best:rv.best[i]});
  }
  return out;
}
let analyzing=false;
async function analyzeLoop(){
  if(analyzing)return;analyzing=true;
  try{
    while(ui.screen==='review'&&G){
      const rv=reviewData();const n=G.moves.length;let i=0;while(i<=n&&rv.sc[i]!=null)i++;
      if(i>n)break;
      const id=G.id;
      R.load(G.start,G.moves.slice(0,i));const st=R.status();
      if(st.over){rv.sc[i]=st.reason==='checkmate'?-MATE:0;rv.best[i]=null}
      else{const r=await engAsk({cmd:'eval',fen:G.start,moves:G.moves.slice(0,i),ms:n>80?110:160});
        if(!G||G.id!==id||ui.screen!=='review'||r.cancelled)break;if(r.error){rv.sc[i]=0;rv.best[i]=null}else{rv.sc[i]=r.score;rv.best[i]=r.uci}}
      if(G.mode!=='online')store.set('game',G);
      renderReview(true);
    }
  }finally{analyzing=false;if(G&&ui.screen==='review')renderReview(true)}
}
function renderReview(light){

  if(pts.length>1){g+=`<path d="M0 ${H} ${pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')} L${pts[pts.length-1][0].toFixed(1)} ${H} Z" style="fill:var(--pw-fill2)" opacity=".95"/><path d="M${pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L')}" fill="none" style="stroke:var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`}
  marks.forEach((m,i)=>{if(m&&m.q&&pts[i+1])g+=`<circle cx="${pts[i+1][0]}" cy="${pts[i+1][1]}" r="3.2" style="fill:${m.q==='??'?'var(--danger)':'#d98a1c'}"/>`});
  const cx=n?ui.ri/n*W:0;g+=`<line x1="${cx}" x2="${cx}" y1="0" y2="${H}" style="stroke:var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;

function renderReviewBoard(){

  if(G.mode==='local'){
    const to=1-R.side;const flip=G.view==='rotate'&&rotFn()&&rotFn()(to?'b':'w');
    ui.dialog={title:'Draw offer',text:`${G.players[R.side].name} offers a draw. ${G.players[to].name}, do you accept?`,flip,buttons:[['no','No, keep playing',false],['yes','Accept draw',true]],
      on:{yes:()=>{G.result={result:'1/2-1/2',reason:'agreement'};sfx('end');persist();render()},no:()=>{toast('Draw declined');render()}}};
    renderOverlay();return}
  /* computer: accepts when it is not better */
  const hc=humanColor();toast('The computer is thinking about it…',1400);
  const r=await engAsk({cmd:'eval',fen:G.start,moves:G.moves.slice(),ms:300});
  if(!G||r.cancelled)return;
  const cpuScore=(R.side===hc?-1:1)*(r.score||0);
  if(cpuScore<=-30||(G.moves.length>60&&Math.abs(cpuScore)<20)){G.result={result:'1/2-1/2',reason:'agreement'};sfx('end');persist();render()}
  else toast('The computer wants to play on.');
}
function notifyTurn(){

/* ---------- online play: one shared doc games/current (written only by the side to move) + one side doc per seat ---------- */
const net={started:false,ready:false,off:false,canWrite:null,me:null,db:null,ref:null,sideRefs:[],doc:null,side:[null,null],
  rev:0,writing:false,dirty:false,mine:null,mineC:-1,sideWriting:false,sideDirty:false,localStart:Date.now(),seenMoves:-1,
  watch:false,prompted:{},firstSnap:true,writingBlock:false,rematching:false,joining:false};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const NOWRITE_CODES=['invalid_argument','not_granted','revoked'];
function syncErr(e){return e&&NOWRITE_CODES.includes(e.code)?"This phone can't save moves. Ask the owner to share Tempo with you as an Editor.":"That didn't sync. Check your connection and try again."}
function handleWriteErr(e){if(e&&NOWRITE_CODES.includes(e.code))net.canWrite=false;toast(syncErr(e),3500);render()}

async function initNet(){
  if(net.started)return;net.started=true;
  try{
    if(!window.claude||!window.claude.use){net.off=true;net.ready=true;render();return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?(u=>{if(!u)return u;let d=null;const K="dev_id";for(const s of ["localStorage","sessionStorage"]){try{d=d||window[s].getItem(K)}catch(e){}}if(!d){d=Math.random().toString(36).slice(2,10);for(const s of ["localStorage","sessionStorage"]){try{window[s].setItem(K,d)}catch(e){}}}return u+"~"+d})(await user.id()):null;
    if(!db||!id){net.off=true;net.ready=true;render();return}
    try{net.canWrite=user?await user.can('data.write'):null}catch(e){net.canWrite=null}
    net.db=db;net.me=id;net.ref=db.doc('games/current');net.sideRefs=[db.doc('games/side0'),db.doc('games/side1')];
    net.ref.onSnapshot(s=>{net.ready=true;net.doc=s.exists?clone(s.data()):null;onMainDoc()},
      ()=>{net.off=true;net.ready=true;if(G&&G.mode==='online')toast('Lost the connection to the online game. Reload to reconnect.',4000);render()});
    net.sideRefs.forEach((r,i)=>r.onSnapshot(s=>{net.side[i]=s.exists?clone(s.data()):null;onSideDoc(i)},()=>{}));
  }catch(e){net.off=true;net.ready=true;render()}
}
function myColor(){if(!G||G.mode!=='online'||!net.me)return -1;return G.players.findIndex(p=>p.uid===net.me)}
function onlineLiveSeat(){const d=net.doc;return !!(d&&d.status==='play'&&d.g&&d.seats&&d.seats.includes(net.me))}
function sideOf(c){
  if(!G)return null;
  if(c===myColor()&&net.mine&&net.mine.gid===G.id)return net.mine;
  const s=net.side[c];return s&&s.gid===G.id&&s.uid===G.players[c].uid?s:null;
}
function stripG(g){const o=clone(g);delete o.review;return o}

/* ---- incoming ---- */
function onMainDoc(){
  const d=net.doc;
  if(G&&G.mode==='online'){
    if(!d||d.status!=='play'||!d.g){
      G=null;net.watch=false;
      if(ui.screen==='game'||ui.screen==='review'){ui.screen='online';toast('The online game was closed.')}
      ui.dialog=null;render();return;
    }
    if(d.gid!==G.id){if(d.seats.includes(net.me)||net.watch)adoptOnline(d,ui.screen==='game'||ui.screen==='review')}
    else if(d.rev>net.rev&&!net.writing&&!net.dirty)adoptOnline(d,false);
  }else if(d&&d.status==='play'&&d.g&&d.seats&&d.seats.includes(net.me)&&((net.firstSnap&&ui.screen==='home')||ui.screen==='online')&&!net.joining){
    adoptOnline(d,true);toast(`Back in your game with ${d.g.players[d.seats.indexOf(net.me)===0?1:0].name}`);
  }
  net.firstSnap=false;
  if(ui.screen==='online'||ui.screen==='home')render();
  onlineReact();
}
function onSideDoc(){
  if(G&&G.mode==='online'){
    const me=myColor();
    if(me>=0&&!net.mine){const s=net.side[me];if(s&&s.gid===G.id&&s.uid===net.me){net.mine=clone(s);net.mineC=me}}
    if(ui.screen==='game')renderGameParts(false);
    onlineReact();
  }
}
function adoptOnline(d,enter){
  const same=G&&G.mode==='online'&&G.id===d.gid;
  const prev=same?G.moves.length:-1,keepReview=same?G.review:null,lastSan=same?G.sans[G.sans.length-1]:null;
  G=clone(d.g);G.mode='online';if(keepReview)G.review=keepReview;
  net.rev=d.rev;net.gid=d.gid;
  if(!same){net.mine=null;net.mineC=-1;net.prompted={};net.rematching=false;const me=myColor();const s=me>=0?net.side[me]:null;if(s&&s.gid===G.id&&s.uid===net.me){net.mine=clone(s);net.mineC=me}}
  syncR();
  if(G.moves.length!==net.seenMoves||!same){net.localStart=Date.now();net.seenMoves=G.moves.length}
  if(enter){
    ui.screen='game';ui.sel=-1;ui.targets=[];ui.hint=null;ui.promo=null;ui.warn=null;ui.banner=true;ui.flip=false;ui.sheet=null;ui.dialog=null;
    BV.pieces.forEach(p=>p.el.remove());BV.pieces=[];
    if(myColor()>=0)writeSide({here:true,at:Date.now()});
  }
  if(same&&G.moves.length!==prev){
    ui.sel=-1;ui.targets=[];ui.hint=null;ui.promo=null;ui.warn=null;
    if(G.moves.length>prev){const san=G.sans[G.sans.length-1]||'';const who=G.players[R.side^1].name;
      if(ui.screen==='game'){if(R.status().over)sfx('end');else if(san.includes('+'))sfx('check');else if(san.includes('x'))sfx('capture');else sfx('move')}
      if(myColor()>=0&&R.side===myColor())toast(`${who} played ${san}`,1800);}
    else{toast('A move was taken back');sfx('move')}
  }
  if(!same)ui.banner=true;
  if(G.result&&!same)ui.banner=true;
  render({anim:same});
}

/* ---- writes ---- */
function onlineCanWrite(){return myColor()>=0&&myColor()===R.side&&!isOver()&&net.canWrite!==false}
function commitOnline(){if(!net.ref||myColor()<0)return;net.rev++;net.dirty=true;flushMain()}
async function flushMain(){
  if(net.writing||!net.dirty)return;net.writing=true;net.dirty=false;
  const body={status:'play',seats:[G.players[0].uid,G.players[1].uid],gid:G.id,rev:net.rev,g:stripG(G)};
  try{await net.ref.set(body)}catch(e){handleWriteErr(e);if(net.doc&&net.doc.g&&net.doc.gid===G.id){net.rev=-1;adoptOnline(net.doc,false)}}
  net.writing=false;if(net.dirty)flushMain();
}
function writeSide(patch){
  const c=myColor();if(c<0||!net.sideRefs.length)return;
  if(!net.mine||net.mine.gid!==G.id||net.mineC!==c)net.mine={gid:G.id,uid:net.me,here:true,at:Date.now(),req:null,ans:null,resign:false,flag:null,rematch:null};
  Object.assign(net.mine,patch);net.mineC=c;net.sideDirty=true;flushSide();
}
async function flushSide(){
  if(net.sideWriting||!net.sideDirty)return;net.sideWriting=true;net.sideDirty=false;
  try{await net.sideRefs[net.mineC].set(clone(net.mine))}catch(e){handleWriteErr(e)}
  net.sideWriting=false;if(net.sideDirty)flushSide();
}
function onlineVisibility(){if(G&&G.mode==='online'&&myColor()>=0&&!isOver())writeSide({here:!document.hidden,at:Date.now()})}
window.addEventListener('pagehide',()=>{if(G&&G.mode==='online'&&myColor()>=0){try{net.mine&&(net.mine.here=false);net.sideRefs[net.mineC]&&net.sideRefs[net.mineC].set(clone(net.mine))}catch(e){}}});

/* ---- derived state ---- */
function derivedResult(){
  if(!G)return null;
  for(const c of [0,1]){const s=sideOf(c);if(!s)continue;
    if(s.resign)return{result:c===0?'0-1':'1-0',reason:'resignation'};
    if(s.flag!=null&&s.flag===G.moves.length&&R.side!==c){const loser=R.side;return R.canMate(c)?{result:loser===0?'0-1':'1-0',reason:'time'}:{result:'1/2-1/2',reason:'time vs insufficient material'}}}
  return null;
}
function presence(c){
  const me=myColor();if(c===me)return '<span class="dot-on"></span>You';
  const s=sideOf(c);
  const pend=me>=0&&sideOf(me)&&sideOf(me).req&&sideOf(me).req.ply===G.moves.length?` · ${sideOf(me).req.kind==='draw'?'draw offered':'takeback asked'}`:'';
  if(!s)return `<span class="dot-off"></span>Not here yet${pend}`;
  if(s.here)return `<span class="dot-on"></span>Online${pend}`;
  const m=Math.round((Date.now()-(s.at||0))/60000);
  return `<span class="dot-off"></span>Away${m>=1&&m<600?` · ${m<60?m+' min':Math.round(m/60)+' h'} ago`:''}${pend}`;
}

/* ---- the request protocol ----
   A request {id,kind:'draw'|'takeback',ply} lives in the requester's side doc and is valid while moves.length===ply.
   The other player answers in their own side doc {ans:{id,ok}}. Whichever phone is the side to move applies an accepted
   request to games/current (pop 1 or 2 moves, or record the draw). */
function onlineReact(){
  if(!G||G.mode!=='online')return;
  const me=myColor();if(me<0)return;
  const opp=1-me,os=sideOf(opp),ms=sideOf(me),mover=R.side===me,oppName=G.players[opp].name;
  if(!G.result&&mover){const d=derivedResult();if(d){G.result=d;commitOnline();render();return}}
  if(isOver()){checkRematch();return}
  /* incoming request from the opponent */
  if(os&&os.req&&os.req.ply===G.moves.length&&!(ms&&ms.ans&&ms.ans.id===os.req.id)&&!net.prompted[os.req.id]){
    net.prompted[os.req.id]=true;const req=clone(os.req);const reqIsMover=R.side===opp;
    const text=req.kind==='draw'?`${oppName} offers a draw.`:reqIsMover?`${oppName} wants to take back their last move. Your reply is taken back too.`:`${oppName} wants to take back their last move.`;
    ui.dialog={title:req.kind==='draw'?'Draw offer':'Take back?',text,key:req.id,buttons:[['no',req.kind==='draw'?'Decline':'No',false],['yes',req.kind==='draw'?'Accept draw':'Allow',true]],
      on:{yes:()=>answerReq(req,true),no:()=>answerReq(req,false)}};
    buzz(80);sfx('notify');renderOverlay();
  }
  /* a request that is no longer valid closes its dialog */
  if(ui.dialog&&ui.dialog.key&&!(os&&os.req&&os.req.id===ui.dialog.key&&os.req.ply===G.moves.length)){ui.dialog=null;renderOverlay()}
  /* answer to my request */
  if(ms&&ms.req){
    if(ms.req.ply!==G.moves.length){writeSide({req:null})}
    else if(os&&os.ans&&os.ans.id===ms.req.id){
      if(!os.ans.ok){toast(`${oppName} said no`);writeSide({req:null})}
      else if(mover){const req=ms.req;writeSide({req:null});applyAccepted(req,me)}
    }
  }
}
function answerReq(req,ok){
  const opp=1-myColor(),os=sideOf(opp);
  if(!os||!os.req||os.req.id!==req.id||os.req.ply!==G.moves.length){toast('That request has expired.');return}
  writeSide({ans:{id:req.id,ok}});
  if(ok&&R.side===myColor())applyAccepted(req,opp);
  renderGameParts(false);
}
function applyAccepted(req,requester){
  if(req.kind==='draw')G.result={result:'1/2-1/2',reason:'agreement'};
  else{const n=requester===R.side?2:1;popPlies(Math.min(n,G.moves.length));G.answered=null}
  net.localStart=Date.now();net.seenMoves=G.moves.length;
  commitOnline();ui.sel=-1;ui.targets=[];ui.hint=null;
  if(req.kind==='draw')sfx('end');else{toast('Move taken back');sfx('move')}
  render();
}
function onlineCanAskUndo(){
  const me=myColor();if(me<0||isOver()||!G.moves.length)return false;
  if(!helpers(G.players[me].name).takeback)return false;
  const ms=sideOf(me);if(ms&&ms.req&&ms.req.ply===G.moves.length)return false;
  if(R.side===me)return G.moves.length>=2;
  return true;
}
function onlineAskUndo(){
  if(!onlineCanAskUndo())return;
  writeSide({req:{id:rid(),kind:'takeback',ply:G.moves.length},ans:null});
  toast(`Asking ${G.players[1-myColor()].name}…`);renderGameParts(false);
}
function onlineOfferDraw(){
  const me=myColor();if(me<0||isOver())return;
  writeSide({req:{id:rid(),kind:'draw',ply:G.moves.length},ans:null});
  toast(R.side===me?'Draw offered. It stands after your move.':`Draw offered to ${G.players[1-me].name}`);renderGameParts(false);
}
function onlineResign(){const me=myColor();if(me<0)return;writeSide({resign:true});if(R.side===me){G.result={result:me===0?'0-1':'1-0',reason:'resignation'};commitOnline()}sfx('end');render()}
function onlineClockCheck(c,v){
  const me=myColor();if(me<0)return;
  if(c===me&&v<=0&&!G.result){syncR();G.clock.left[c]=0;G.result=R.canMate(1-c)?{result:c?'1-0':'0-1',reason:'time'}:{result:'1/2-1/2',reason:'time vs insufficient material'};commitOnline();sfx('end');render()}
  else if(c!==me&&v<-8000){const ms=sideOf(me);if(!ms||ms.flag!==G.moves.length){writeSide({flag:G.moves.length});render()}}
}
/* keep a draw offer standing when the offerer then moves */
const _commitMove=commitMove;
commitMove=function(m,o){
  let carry=null;
  if(G&&G.mode==='online'){const ms=sideOf(myColor());if(ms&&ms.req&&ms.req.kind==='draw'&&ms.req.ply===G.moves.length)carry=ms.req}
  _commitMove(m,o);
  if(carry&&G&&G.mode==='online'&&!G.result)writeSide({req:Object.assign({},carry,{ply:G.moves.length})});
  if(G&&G.mode==='online'&&myColor()>=0)writeSide({here:true,at:Date.now()});
};

/* ---- rematch ---- */
function onlineRematch(){
  const me=myColor();if(me<0)return;
  writeSide({rematch:G.id});
  toast(`Rematch asked. Waiting for ${G.players[1-me].name}…`);
  checkRematch();renderGameParts(false);
}
function checkRematch(){
  const me=myColor();if(me!==1||net.rematching)return;
  const a=sideOf(0),b=sideOf(1);
  if(!(a&&b&&a.rematch===G.id&&b.rematch===G.id))return;
  net.rematching=true;
  const old=G;const players=[clone(old.players[1]),clone(old.players[0])];
  let start=old.start,odds=old.odds;if(odds){odds={by:1-odds.by,piece:odds.piece};start=oddsFen(odds.by,odds.piece)}
  let clock=null;if(old.clock)clock={base:[old.clock.base[1],old.clock.base[0]],inc:old.clock.inc,left:[old.clock.base[1],old.clock.base[0]],at:0};
  const g=newGame({mode:'online',players,start,clock,odds});
  const body={status:'play',seats:[players[0].uid,players[1].uid],gid:g.id,rev:1,g};
  net.doc=body;adoptOnline(body,true);
  net.ref.set(body).catch(e=>{net.rematching=false;handleWriteErr(e)});

async function joinGame(){
