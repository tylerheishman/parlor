<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3f5a2b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/furrow-180.png"><link rel="icon" type="image/png" href="../icons/furrow-192.png"><meta name="apple-mobile-web-app-title" content="Furrow"><meta name="mobile-web-app-capable" content="yes"><script src="../config.js"></script><script src="../shim.js" data-game="furrow"></script></head><body><title>Furrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column. Thin sticky round track on top, then turn banner, resources, tabs; board of action cards or a soil-plot farm grid; tool sheet docks to the bottom during actions. */
:root{
  --bg:#e4e8d8; --surface:#eef1e4; --raised:#fbfcf6; --ink:#1f2419; --muted:#5b6450; --line:#c3caaf;
  --accent:#8f6510; --accent-ink:#fffaf0; --hl:#e3a90f;
  --p1:#2c5d88; --p2:#a33d2a; --p3:#3c7a37; --p4:#77479a; --p5:#a8466f; --minor:#2b6e55;
  --soil:#6f553b; --meadow:#b7c99a; --grass:#93b36a; --furrow:#bf9a5e; --furrow2:#a8834a; --fence:#4f341a;
  --wall-wood:#a9783f; --wall-wood2:#8e6231; --wall-clay:#c27447; --wall-clay2:#a65d34; --wall-stone:#a3a8aa; --wall-stone2:#878c8e; --roof:#3e2a17;
  --display:'Young Serif', Georgia, 'Times New Roman', serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a13; --surface:#1d241a; --raised:#252e21; --ink:#e7ead9; --muted:#9fa98d; --line:#364130;
  --accent:#e2b44a; --accent-ink:#201a08; --hl:#f2c94c;
  --p1:#3f78a8; --p2:#b9513a; --p3:#4f9147; --p4:#9064b3; --p5:#c0587f; --minor:#6fc29f;
  --soil:#3b2e21; --meadow:#4d5f3c; --grass:#5d7d3e; --furrow:#7d6238; --furrow2:#68512d; --fence:#d6b27c;
  --roof:#22170c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a13; --surface:#1d241a; --raised:#252e21; --ink:#e7ead9; --muted:#9fa98d; --line:#364130;
  --accent:#e2b44a; --accent-ink:#201a08; --hl:#f2c94c;
  --p1:#3f78a8; --p2:#b9513a; --p3:#4f9147; --p4:#9064b3; --p5:#c0587f; --minor:#6fc29f;
  --soil:#3b2e21; --meadow:#4d5f3c; --grass:#5d7d3e; --furrow:#7d6238; --furrow2:#68512d; --fence:#d6b27c;
  --roof:#22170c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.with-panel{padding-bottom:58vh}
.with-confirm{padding-bottom:180px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.ic{width:18px;height:18px;flex:none;display:block}
.sub{font-size:12.5px;color:var(--muted);line-height:1.35;margin:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px 9px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:22px;line-height:1}
.rnd{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.rnd b{color:var(--ink);font-size:17px;font-weight:700}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.pill.strong{background:var(--raised);border-color:var(--accent)}
.track{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:9px}
.track i{height:6px;border-radius:2px;background:var(--line);position:relative}
.track i.past{background:var(--muted);opacity:.5}
.track i.now{background:var(--accent)}
.track i.h::after{content:"";position:absolute;left:50%;top:9px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.trackcap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:12px}

/* turn */
.turn{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--pc);color:#fff}
.turn b{font-family:var(--display);font-weight:400;font-size:18px}
.turn .pill{margin-left:auto;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.workers{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:7px 2px 0;font-variant-numeric:tabular-nums}
.workers span{display:inline-flex;align-items:center;gap:5px}
.workers i{width:8px;height:8px;border-radius:50%;background:var(--pc);display:inline-block}
.order{display:flex;flex-direction:column;gap:3px;margin-top:9px}
.prow{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 9px;border-radius:9px;min-height:30px}
.prow.now{background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--pc)}
.prow .dot{margin-right:0}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:7em}
.houses{display:inline-flex;align-items:center;gap:2px}
.hs{width:15px;height:15px;display:block}
.extra{display:inline-flex;gap:1px;margin-left:2px}
.extra .ic{width:13px;height:13px;color:var(--pc)}
.grow{font-size:11px;font-weight:700;color:var(--minor);white-space:nowrap}
.first{font-size:10px;font-weight:700;letter-spacing:.04em;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;white-space:nowrap}
.wl{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.arow .ic{width:26px;height:26px}
.aname{flex:1;min-width:0;display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:1.4em;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.step .btn{width:38px;padding:7px 0;font-size:18px;line-height:1}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.recap li{display:flex;gap:9px;align-items:baseline;font-size:14px;line-height:1.35}
.recap li i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--pc);transform:translateY(-1px)}
.recap li.sys{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.recent{margin:8px 2px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.recent li:first-child{color:var(--ink)}

/* resources */
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 5px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.chip.zero{opacity:.4}
.chip.food{border-color:var(--accent)}
.pills{margin-left:auto;display:flex;gap:6px}

/* tabs */
.tabs{display:flex;gap:3px;margin-top:12px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 5px;border-radius:9px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button.on{background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tabs.many button{font-size:12.5px;padding:8px 3px}
.tabs.many .dot{margin-right:3px;width:8px;height:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:5px;vertical-align:1px}
.cpu{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-left:5px;opacity:.75;vertical-align:1px}

/* board */
.sect{margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.space{position:relative;text-align:left;display:flex;flex-direction:column;gap:4px;padding:10px 11px 11px;border-radius:12px;border:1px solid var(--line);background:var(--raised);min-height:88px}
.space:not(:disabled):active{transform:scale(.98)}
.space:disabled{cursor:default}
.space:disabled:not(.taken){opacity:.5}
.space.taken{background:var(--surface)}
.space.fresh{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.space.sel{border-color:var(--hl);box-shadow:inset 0 0 0 2px var(--hl)}
.space.next{border-style:dashed;background:transparent;justify-content:center}
.sname{font-family:var(--display);font-size:15px;line-height:1.2;padding-right:24px}
.pile{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pile .ic{width:24px;height:24px}
.pile.multi{font-size:16px;gap:8px}
.pile.multi span{display:inline-flex;align-items:center;gap:2px}
.pile.multi .ic{width:18px;height:18px}
.rbadge{position:absolute;top:10px;right:10px;font-size:11px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.worker{position:absolute;right:8px;bottom:8px;color:var(--pc)}
.worker .ic{width:24px;height:24px}
.log{margin:18px 2px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.log b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* farm */
.farmhead{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.farmhead h2{font-size:20px}
.farm{display:grid;grid-template-columns:8px repeat(5,minmax(0,1fr) 8px);grid-template-rows:8px repeat(3,auto 8px);padding:2px;background:var(--soil);border-radius:14px;margin-top:10px}
.farm.fencing{grid-template-columns:16px repeat(5,minmax(0,1fr) 16px);grid-template-rows:16px repeat(3,auto 16px)}
.edge{position:relative;border:0;padding:0;margin:0;background:none;min-width:0;min-height:0}
.edge::after{content:"";position:absolute;border-radius:3px;background:transparent}
.edge.h::after{left:-3px;right:-3px;top:50%;height:5px;transform:translateY(-50%)}
.edge.v::after{top:-3px;bottom:-3px;left:50%;width:5px;transform:translateX(-50%)}
.edge.fence::after{background:var(--fence)}
button.edge{cursor:pointer}
button.edge::after{background:rgba(255,255,255,.22)}
button.edge.pend::after{background:var(--hl);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cell.preview{background:var(--grass);opacity:.85}
.cell.tap{cursor:pointer}
.hint.warn{color:var(--p2);font-weight:600}
.hint.okline{color:var(--minor);font-weight:600}
.cell{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:7px;background:var(--meadow);padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
button.cell{cursor:pointer}
.cell.room{align-items:flex-end;padding-bottom:6px}
.cell.house-wood{background:repeating-linear-gradient(90deg,var(--wall-wood) 0 9px,var(--wall-wood2) 9px 10px)}
.cell.house-clay{background:repeating-linear-gradient(0deg,var(--wall-clay) 0 7px,var(--wall-clay2) 7px 8px)}
.cell.house-stone{background:repeating-linear-gradient(0deg,var(--wall-stone) 0 11px,var(--wall-stone2) 11px 12px),var(--wall-stone)}
.roof{position:absolute;top:9%;left:20%;right:20%;height:26%;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%)}
.cell.field{background:repeating-linear-gradient(0deg,var(--furrow) 0 6px,var(--furrow2) 6px 9px)}
.cell.pasture{background:var(--grass)}
.barn{position:absolute;right:5px;top:5px;width:15px;height:13px;background:var(--roof);clip-path:polygon(50% 0,100% 38%,100% 100%,0 100%,0 38%)}

.tag{display:inline-flex;align-items:center;gap:2px;background:var(--raised);color:var(--ink);border-radius:999px;padding:2px 7px 2px 3px;font-weight:700;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.tag .ic{width:16px;height:16px}
.cell.can{outline:3px solid var(--hl);outline-offset:-2px;z-index:1}
.cell.can::after{content:"";position:absolute;inset:0;background:var(--hl);opacity:.16}
.cost{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:700;background:var(--hl);color:#2a1d02;border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;margin-top:14px}
.stat span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.imps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.imp{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--raised)}

/* cards */
.cards{margin-top:6px}
.cardrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cardrow:first-child{border-top:0}
.cmain{flex:1;min-width:0}
.ctype{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent)}
.ctype.minor{color:var(--minor)}
.cname{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.ctext{font-size:12.5px;color:var(--muted);margin-top:2px}
.cheld{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700}
.cheld .ic{width:15px;height:15px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 14px;font-weight:600;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 11px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.42;cursor:default}
.btn .ic{display:inline-block;vertical-align:-4px}

/* action panel + confirm bar */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--raised);border-top:1px solid var(--line);box-shadow:0 -10px 28px rgba(0,0,0,.18);border-radius:18px 18px 0 0;max-height:60vh;overflow:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.pin{max-width:588px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
.phead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.phead h2{font-size:19px}
.seg{display:flex;gap:4px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:11px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:disabled{opacity:.35;cursor:default}
.hint{font-size:14px;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pbtns{display:flex;gap:8px;position:sticky;bottom:0;background:var(--raised);padding-top:4px}
.pbtns .btn{flex:1}
.costs{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.costs span{display:inline-flex;align-items:center;gap:2px}
.costs .ic{width:16px;height:16px}

/* improvements */
.maj{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.maj:first-child{border-top:0}
.mmain{flex:1;min-width:0}
.mname{font-weight:700}
.pts{font-weight:600;font-size:12px;color:var(--accent)}
.mtxt{font-size:12.5px;color:var(--muted);margin-top:2px}
.mact{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.owned{font-size:12.5px;font-weight:700;color:#fff;background:var(--pc);border-radius:999px;padding:3px 10px;white-space:nowrap}

/* kitchen + feed */
.kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kit .btn{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.feed{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.needbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.needbox div{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.needbox span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.needbox b{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.short b{color:var(--p2)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,12,8,.45);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86vh;overflow:auto;background:var(--raised);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sin{max-width:588px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sin h2{font-size:22px}
.sin h3{font-size:16px;margin-top:6px}
.sin p,.sin li{font-size:14px;margin:0;max-width:65ch}
.sin ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.shead{display:flex;align-items:center;gap:10px}
.shead .pill{margin-left:auto}
.setting{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.setting div{flex:1;min-width:0}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.with-panel .toast{bottom:calc(60vh + 10px)}
.with-confirm .toast{bottom:170px}

/* setup */
.setup{display:flex;flex-direction:column;gap:16px;padding-block:28px 20px}
.logo{font-size:56px;line-height:.95;letter-spacing:-.01em}
.furrows{height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--furrow) 0 14px,var(--furrow2) 14px 20px);max-width:220px}
.lede{font-size:16px;margin:0;max-width:40ch;color:var(--muted)}
.setup .farm{margin-top:0}
.field-in{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field-in input{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h2{font-size:20px}
.box p{margin:0;font-size:14px}
.pick{display:flex;flex-direction:column;gap:5px}
.pick>span{font-size:13px;font-weight:600;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--minor)}

/* end */
.end{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.winner{font-size:30px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-weight:600;color:var(--muted);font-size:12.5px}
.tbl tfoot td{font-weight:700;font-size:17px;border-bottom:0}
.neg{color:var(--p2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<script>
const KEY='furrow-save-v1';
const COLS=5, ROWS=3;

function deal(g){
  const ids=Object.keys(CARDS),n=g.players.length;
  const occ=shuffle(ids.filter(i=>CARDS[i].type==='occ')),min=shuffle(ids.filter(i=>CARDS[i].type==='minor'));
  const h=Math.min(7,Math.floor(occ.length/n),Math.floor(min.length/n));
  g.players.forEach((p,i)=>{p.hand=[...occ.slice(i*h,(i+1)*h),...min.slice(i*h,(i+1)*h)];p.cards=p.cards||[];p.pending=p.pending||{}});
}
function newGame(specs){
  const cards=[1,2,3,4,5,6].flatMap(s=>shuffle(STAGES[s]));
  const perm=permFor(specs.length);const spaces={};perm.forEach(id=>spaces[id]={acc:{},occ:null});
  const first=Math.floor(Math.random()*specs.length);
  G={round:0,cards,revealed:[],perm,spaces,players:specs.map((s,i)=>mkPlayer(s.name,i===first?2:3,s.bot)),start:first,nextStart:first,turn:first,phase:'work',log:[],seq:0,
     majors:Object.fromEntries(Object.keys(MAJORS).map(k=>[k,null])),feedIdx:first,fed:0,feedOrder:specs.map((_,k)=>(first+k)%specs.length),undo:null};
  deal(G);log(`${G.players[first].name} was drawn to go first`);startRound();runBots();return G;
}

    return mine+0.3*(mine-best);
  }finally{G=g0;ui.act=null}
}
function chooseSpace(pi){
  // The plan proposes; the scoring judgment can overrule it when the planned move looks clearly worse than the best one.
  // When the top few moves are close, play the round out for each of them and pick the one that ends best.
  if(typeof AI_OVERRIDE!=='undefined'&&AI_OVERRIDE&&AI_OVERRIDE[pi])return AI_OVERRIDE[pi](pi);
  const real=G;
  try{
    const vals={},W_=wOf(pi);
    const best=bestValue(pi,G.players.length>=4?0:BOT_DEPTH,true,vals);
    G=real;
    let choice=best.id,planned=null;
    if(W_.plan){const pl=planSpace(pi);G=real;
      if(pl&&vals[pl[0]]!==undefined&&vals[pl[0]]>=best.v-pl[1]){choice=pl[0];planned=pl}}
    if(W_.endRoll&&G.round>=W_.endFrom){
      const ranked=Object.entries(vals).sort((a,b)=>b[1]-a[1]);
      const cands=ranked.slice(0,G.players.length>=4?2:G.players.length===3?3:W_.endK).map(x=>x[0]);if(planned&&!cands.includes(planned[0]))cands.push(planned[0]);
      if(cands.length>1){const base=snapOf();let bestR=-Infinity,pick=choice;
        for(const id of cands){const v=playOutGame(pi,id,base);if(v>bestR){bestR=v;pick=id}}
        G=real;return pick}
    }
    if(W_.roll&&!planned){
      const ranked=Object.entries(vals).sort((a,b)=>b[1]-a[1]);
      const cands=ranked.filter(([,v])=>v>=ranked[0][1]-W_.rollGap).slice(0,W_.rollK).map(x=>x[0]);
      if(planned&&!cands.includes(planned[0]))cands.push(planned[0]);
      if(cands.length>1){
        const base=snapOf();let bestR=-Infinity,pick=choice;const rv={};
        for(const id of cands){let t=0;for(let k=0;k<W_.rollN;k++)t+=playOutRound(pi,id,base);rv[id]=t/W_.rollN+(planned&&id===planned[0]?planned[1]*W_.rollPlan:0);if(rv[id]>bestR){bestR=rv[id];pick=id}}
        G=real;choice=pick;
      }
    }
    return choice;
  }finally{G=real;ui.act=null}
}
var AI_OVERRIDE;
function botTurn(){
  const pi=G.turn,id=chooseSpace(pi);
  if(!id){G.players[pi].placed=G.players[pi].workers;log(`${G.players[pi].name} passed`);nextTurn();return}
  doTake(id);
  if(ui.act){botAct();const act=ui.act;ui.act=null;logAct(act)}
  nextTurn();
}
function feedOptions(p){
  const r=cookRates(p),o=[];
  crafts(p).forEach(c=>{if(p.res[c.res]>0&&!p.crafted[c.id])o.push({food:c.rate,apply:()=>{p.res[c.res]--;p.res.food+=c.rate;p.crafted[c.id]=1}})});
  if(r)A.forEach(t=>{if(p.animals[t]>0)o.push({food:r[t],pair:p.animals[t]===2,apply:()=>{p.animals[t]--;p.res.food+=r[t]}})});
  if(p.res.veg>0)o.push({food:r?r.veg:1,apply:()=>{p.res.veg--;p.res.food+=r?r.veg:1}});
  if(p.res.grain>0)o.push({food:1,apply:()=>{p.res.grain--;p.res.food++}});
  return o;
}
function botFeedSmart(i){
  // Make up the shortfall by giving up whatever costs the fewest points per food. Breeding pairs are worth keeping.
  const p=G.players[i],need=needFood(p);let g=0;
  while(p.res.food<need&&g++<40){
    const opts=feedOptions(p);if(!opts.length)break;let best=null,bl=Infinity;
    for(const o of opts){const snap=JSON.stringify({res:p.res,an:p.animals,cr:p.crafted});const before=total(p);o.apply();
      let loss=(before-total(p))+(o.pair&&G.round<14?1.5:0);const r=JSON.parse(snap);p.res=r.res;p.animals=r.an;p.crafted=r.cr;
      const per=loss/Math.min(o.food,need-p.res.food);if(per<bl){bl=per;best=o}}
    if(!best||bl>3)break;best.apply();
  }
}
function botFeed(){
  const i=G.feedIdx,p=G.players[i],need=needFood(p),r=cookRates(p);
  if(wOf(i).smartFeed){botFeedSmart(i);doFeed(i);advanceFeed();return}
  crafts(p).forEach(c=>{if(p.res.food<need&&p.res[c.res]>0&&!p.crafted[c.id]){p.res[c.res]--;p.res.food+=c.rate;p.crafted[c.id]=1}});
  let g=0;
  while(p.res.food<need&&g++<40){
    if(r){const t=A.find(a=>p.animals[a]>2);if(t){p.animals[t]--;p.res.food+=r[t];continue}}
    if(p.res.veg>0){p.res.veg--;p.res.food+=r?r.veg:1;continue}
    if(p.res.grain>1){p.res.grain--;p.res.food++;continue}
    if(r){const t=A.slice().sort((a,b)=>r[b]-r[a]).find(a=>p.animals[a]>0);if(t){p.animals[t]--;p.res.food+=r[t];continue}}
    if(p.res.grain>0){p.res.grain--;p.res.food++;continue}
    break;
  }
  doFeed(i);advanceFeed();
}
function runBots(){

const ASYNC_BOTS=typeof requestAnimationFrame==='function';
function runBotsThen(done){

async function initNet(){

    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?(u=>{if(!u)return u;let d=null;const K="dev_id";for(const s of ["localStorage","sessionStorage"]){try{d=d||window[s].getItem(K)}catch(e){}}if(!d){d=Math.random().toString(36).slice(2,10);for(const s of ["localStorage","sessionStorage"]){try{window[s].setItem(K,d)}catch(e){}}}return u+"~"+d})(await user.id()):null;

  }catch(e){net.off=true;net.ready=true;render()}

  d.seats[i]=net.me;d.names[i]=name;

  }
}

/* ---------- scoring ---------- */
function scoreRows(p){
  const fields=count(p,'field'),pastures=pastureGroups(p).length;
  const grain=grainTotal(p),veg=vegTotal(p);
  const {sheep:s,boar:b,cattle:c}=p.animals;
  const unused=p.farm.filter(x=>x.t==='empty'&&!x.stable).length;
  const fenced=p.farm.filter(x=>x.t==='pasture'&&x.stable).length;
  const rooms=count(p,'room');
  let bonus=0;p.imps.forEach(id=>{const m=MAJORS[id];if(m.bonus){const n=p.res[m.craft];bonus+=n>=m.bonus[2]?3:n>=m.bonus[1]?2:n>=m.bonus[0]?1:0}});
  const cardPts=p.cards.reduce((t,id)=>{const k=CARDS[id];return t+(k.pts||0)+(k.points?k.points(p):0)},0);
  return [
    ['Fields',fields<=1?-1:Math.min(4,fields-1)],
    ['Pastures',pastures===0?-1:Math.min(4,pastures)],
    ['Grain',grain===0?-1:grain<=3?1:grain<=5?2:grain<=7?3:4],
    ['Vegetables',veg===0?-1:Math.min(4,veg)],
    ['Sheep',s===0?-1:s<=3?1:s<=5?2:s<=7?3:4],
    ['Boar',b===0?-1:b<=2?1:b<=4?2:b<=6?3:4],
    ['Cattle',c===0?-1:c===1?1:c<=3?2:c<=5?3:4],
    ['Unused spaces',-unused],
    ['Fenced stables',fenced],
    ['House rooms',p.house==='clay'?rooms:p.house==='stone'?rooms*2:0],
    ['Family',p.members*3],
    ['Major improvements',p.imps.reduce((s,id)=>s+MAJORS[id].pts,0)],
    ['Craft bonus',bonus],
    ['Cards',cardPts],
    ['Begging',-3*p.begging],
  ];
}
const total=p=>scoreRows(p).reduce((s,r)=>s+r[1],0);

  else{
    const d=net.doc,st=d&&d.status,S=ui.setup;
    const noWrite=net.canWrite===false?`<div class="setting"><div><b>This phone can watch but can't join or host.</b><p class="sub">The owner of Furrow needs to open the Share menu, turn off "Anyone with the link", and invite you by email as an Editor. Then reload this page.</p></div></div>`:'';
    if(noWrite&&st!=='play')inner=(st==='lobby'?`<p><b>${esc(d.names[0]||'Someone')}</b> is hosting a game.</p>`:'')+noWrite;
    else if(st==='lobby'){
      const joined=d.seats.filter(Boolean).length,need=d.seats.length,bots=d.bots||0;
      const roster=d.seats.map((u,i)=>u?esc(d.names[i]||'Player'):'open seat').join(', ')+(bots?`, ${bots} computer${bots>1?'s':''}`:'');
      if(d.seats.includes(net.me))inner=`<p><b>Waiting for players.</b> ${joined} of ${need} people have joined.</p><p class="sub">${roster}</p><p class="sub">Others open Furrow on their phones, with the same table code, and tap Join.</p>${d.seats[0]===net.me?'<button class="btn" data-do="cancelHost">Cancel game</button>':''}`;
      else inner=`<p><b>${esc(d.names[0]||'Someone')}</b> is hosting a game. ${joined} of ${need} people have joined.</p><p class="sub">${roster}</p><label class="field-in" for="jn">Your name<input id="jn" placeholder="Player" maxlength="14" autocomplete="off"></label><button class="btn primary wide" data-do="join">Join game</button>`;
    }
    else if(st==='play'&&d.g)inner=`<p>${d.g.players.map(p=>esc(p.name)).join(', ')} are playing, round ${d.g.round}.</p><div class="row" style="margin-top:0"><button class="btn" data-do="watch">Watch</button><button class="btn" data-do="newgame">End it and start over</button></div>`;
    else inner=`<label class="field-in" for="hn">Your name<input id="hn" placeholder="Player 1" maxlength="14" autocomplete="off"></label>
      <div class="pick"><span>People, including you</span>${segPick('op',[2,3,4,5],S.op)}</div>
      <div class="pick"><span>Computer players</span>${segPick('ob',[0,1,2,3],S.ob,v=>S.op+v>MAXP)}</div>
      <button class="btn primary wide" data-do="host">Host a game</button><p class="sub">Then each other person opens this page on their phone and taps Join. Seating order is drawn at random.</p>`;
  }
  return `<section class="box"><h2>Each on their own phone</h2>${inner}</section>`;
}
function setupHTML(){
  const saved=loadSave();const canContinue=saved&&saved.phase!=='end';const S=ui.setup;
  const names=Array.from({length:S.lp},(_,i)=>`<label class="field-in" for="n${i}">${S.lp===1?'Your name':`Player ${i+1}`}<input id="n${i}" placeholder="Player ${i+1}" maxlength="14" autocomplete="off"></label>`).join('');
  return `<main class="setup"><h1 class="logo">Furrow</h1><div class="furrows"></div>
  <p class="lede">Grow a family and a farm across fourteen rounds. Two to five players, people or computers, on one phone or several.</p>
  ${sampleFarm()}
  <section class="box"><h2>On this phone</h2><p class="sub">Play solo against the computer, or pass the phone between people.</p>
  ${canContinue?`<button class="btn wide" data-do="continueLocal">Continue saved game (round ${saved.round})</button>`:''}
  <div class="pick"><span>People</span>${segPick('lp',[1,2,3,4,5],S.lp)}</div>
  <div class="pick"><span>Computer players</span>${segPick('lb',[0,1,2,3,4],S.lb,v=>S.lp+v>MAXP||S.lp+v<2)}</div>
  <div class="names">${names}</div>
  <button class="btn primary wide" data-do="start">Start game</button></section>
  ${onlineBox()}
  <button class="btn wide" data-do="rules">How to play</button></main>`;
}
function rulesHTML(){
  return `<div class="shead"><h2>${G?'Menu':'How to play'}</h2><button class="pill" data-do="close">Close</button></div>
  <div class="setting"><div><b>Confirm before taking a space</b><p class="sub">Tap a space to select it, then tap again to confirm. Stops accidental moves while scrolling.</p></div><button class="pill strong" data-do="toggleConfirm">${prefConfirm?'On':'Off'}</button></div>
  <div class="setting"><div><b>Show what happened when your turn starts</b><p class="sub">A summary of every move since your last one, color-coded by player.</p></div><button class="pill strong" data-do="toggleRecap">${prefRecap?'On':'Off'}</button></div>
  ${G&&mode==='local'?'<button class="btn wide" data-do="home">Back to home (game is saved)</button>':''}
  ${G?'<button class="btn wide" data-do="newgame">End game and start a new one</button>':''}
  <h3>Players</h3><ul><li>2 to 5 players, any mix of people and computers. Play solo, pass one phone around, or have each person on their own phone.</li><li>More players means more action spaces: 3 adds Grove, Hollow and Evening Lessons; 4 adds Market and Street Fair; 5 adds Odd Jobs, Marsh, Builder's Yard, Animal Fair, Stone Pit, Mill Pond, and a second growth space, Nursery, that opens in round 5. Everyone always gets 7 occupations and 7 minor improvements.</li><li>Computer players move instantly when their turn comes. Their moves appear in the recent-moves list and the game log.</li></ul>
  <h3>Undo</h3><ul><li>After each move, an Undo button appears in the turn banner. It takes back your last move, along with any computer moves that followed it.</li><li>Online, only the person who made the move can undo it, and only until another person moves.</li><li>Inside an action, Undo action cancels the whole action.</li></ul>
  <h3>Each on their own phone</h3><ul><li>Each person opens Furrow on their own phone, with the same table code.</li><li>One phone hosts and picks the number of people and computers. The others tap Join. Every phone updates live, and only the player whose turn it is can act.</li></ul>
  <h3>Rounds</h3><ul><li>Build the best farm in 14 rounds. Players take turns placing one family member on an action space. A space holds one person per round.</li><li>One new action opens each round, in six stages. Piles on accumulating spaces grow until someone takes them.</li><li>Seating order around the table and the first player are both drawn at random. After that, Meeting Place makes you first next round. The first player starts with 2 food, everyone else with 3.</li></ul>
  <h3>Cards</h3><ul><li>Each player starts with a private hand of occupations and minor improvements. Tap Hand to see yours.</li><li>Lessons plays 1 occupation. Your first is free, then each costs 1 food.</li><li>Minor improvements cost the resources shown. Play one with Meeting Place, Major Improvement, House Redevelopment or Family Growth.</li></ul>
  <h3>Harvest</h3><p>After rounds 4, 7, 9, 11, 13 and 14:</p><ul><li>Each sown field gives 1 crop.</li><li>Feed 2 food per person, 1 for a baby born that round. Each missing food is a begging card (−3).</li><li>Each kind of animal with 2 or more gets 1 baby if there's room.</li></ul>
  <h3>Building</h3><ul><li>Room: 5 of your house material + 2 reed, touching the house. You start with 2 wood rooms.</li><li>Family Growth needs a spare room, until Urgent Growth appears.</li><li>Renovate wood → clay → stone: 1 material per room + 1 reed.</li><li>Fields must touch other fields. Sow 1 grain to get 3, 1 vegetable to get 2.</li><li>Fences go on the gaps between spaces, 1 wood per piece, 15 pieces max. Tap gaps one by one, or tap a space to fence around it. Every new piece must help close off a complete pasture, and all your pastures must touch.</li><li>A pasture can span several spaces. A fence piece across an existing pasture splits it in two.</li><li>Stables cost 2 wood, max 4.</li><li>Building a Clay Oven, Stone Oven or Bake Stone lets you bake right away.</li></ul>
  <h3>Animals</h3><ul><li>A pasture holds 2 animals per space, all of one kind. Each stable inside a pasture doubles what it holds. A stable on open meadow holds 1. Your house holds 1 pet. Some cards add pens.</li><li>Animals are arranged for you. If they don't fit, you choose which to keep. With a Fireplace or Hearth the extras are cooked; otherwise they run away.</li></ul>
  <h3>Scoring</h3><ul><li>Fields, pastures, grain, vegetables, sheep, boar, cattle: −1 for none, up to +4.</li><li>−1 per unused farm space, +1 per stable inside a pasture.</li><li>Clay rooms +1, stone rooms +2, each person +3, improvement and card points, craft bonuses.</li></ul>`;
}
function sheetHTML(){
  if(!ui.sheet&&!ui.animals)return '';
  let inner='';
  if(ui.animals){return `<div class="scrim"><div class="sheet" role="dialog"><div class="sin">${animalHTML()}</div></div></div>`}
  if(ui.sheet==='rules')inner=rulesHTML();
  if(ui.sheet==='recap')inner=recapHTML();
  if(ui.sheet==='imps')inner=`<div class="shead"><h2>Major improvements</h2><button class="pill" data-do="close">Close</button></div><p class="sub">Built with the Major Improvement or House Redevelopment actions.</p><div>${majorsHTML(cur(),null)}</div>`;
  if(ui.sheet==='log')inner=`<div class="shead"><h2>Game log</h2><button class="pill" data-do="close">Close</button></div><ul class="log" style="margin-top:0">${G.log.map(l=>`<li><b>R${l.r}</b> ${esc(l.m)}</li>`).join('')}</ul>`;
  if(ui.sheet==='kitchen'){const p=actor();inner=`<div class="shead"><h2>Kitchen</h2><button class="pill" data-do="close">Close</button></div><p class="sub">${esc(p.name)} has ${p.res.food} food. Next harvest needs ${needFood(p)}.</p>${kitchenHTML(p,false)}`}
  if(ui.sheet==='hand'){const p=me();inner=`<div class="shead"><h2>${esc(p.name)}'s hand</h2><button class="pill" data-do="close">Close</button></div>
    <p class="sub">Keep this private. Your next occupation at Lessons costs ${occCost(p)} food.</p>
    <h3>Occupations</h3>${handList(p,'occ',null)}<h3>Minor improvements</h3>${handList(p,'minor',null)}`}
  if(ui.sheet==='confirmNew')inner=`<h2>Start over?</h2><p>${mode==='online'||!G?'This ends the online game on every phone.':'The current game will be lost.'}</p><div class="pbtns"><button class="btn" data-do="close">Keep playing</button><button class="btn primary" data-do="reallyNew">Start over</button></div>`;
  return `<div class="scrim" data-do="scrim"><div class="sheet" role="dialog"><div class="sin">${inner}</div></div></div>`;
}
const toastHTML=()=>ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:'';

function render(){
  if(quiet)return;
  const app=document.getElementById('app');
  const keep={};let focus=null;
  try{app.querySelectorAll('input[id]').forEach(i=>keep[i.id]=i.value);focus=document.activeElement&&document.activeElement.id}catch(e){}
  paint(app);notifyTurn();
  for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id]}
  if(focus){const el=document.getElementById(focus);if(el&&el.tagName==='INPUT')el.focus()}
}
function paint(app){
  if(!G){app.innerHTML=setupHTML()+sheetHTML()+toastHTML();return}
  if(G.phase==='end'){app.innerHTML=headerHTML()+(canUndo()?`<div class="row"><button class="btn sm" data-do="undo">Undo ${esc(G.undo.label)}</button></div>`:'')+endHTML()+sheetHTML()+toastHTML();return}
  if(ui.sel&&(!mine()||G.phase!=='work'||!canTake(ui.sel,G.turn)))ui.sel=null;
  if(ui.sheet==='recap'&&!mine())ui.sheet=null;
  if(prefRecap&&!ui.sheet&&!ui.animals&&!ui.act&&mine()&&recapEntries().length)ui.sheet='recap';
  const vp=ui.view==='board'?me():G.players[+ui.view.slice(1)];
  let h=headerHTML()+(ui.act?`<div class="turn" style="--pc:${pc(G.turn)}"><b>${esc(cur().name)}</b><span>${SPACES[ui.act.id].name}</span></div>`:statusHTML())+resHTML(vp)+tabsHTML();
  h+=ui.view==='board'?(G.phase==='feed'?feedHTML():boardHTML()):farmHTML(+ui.view.slice(1));
  const conf=confirmHTML();
  if(ui.act)h+=panelHTML();else h+=conf;
  app.innerHTML=`<div class="${ui.act?'with-panel':conf?'with-confirm':''}">${h}${sheetHTML()}${toastHTML()}</div>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const d=b.dataset;
  if(ui.busy&&!['view','rules','close','scrim','log','imps'].includes(d.do))return;
  if(d.do==='scrim'&&e.target!==b)return;
  switch(d.do){
    case 'start':{const S=ui.setup;const specs=[];
      for(let i=0;i<S.lp;i++)specs.push({name:(document.getElementById('n'+i)?.value||'').trim()||(S.lp===1?'You':`Player ${i+1}`)});
      BOTNAMES.slice(0,S.lb).forEach(n=>specs.push({name:n,bot:true}));
      mode='local';newGame(shuffle(specs));save();ui.view='board';ui.sheet=null;render();break}
    case 'setup':{const S=ui.setup;S[d.k]=+d.v;
      if(S.lp+S.lb>MAXP)S.lb=MAXP-S.lp;if(S.lp+S.lb<2)S.lb=2-S.lp;if(S.op+S.ob>MAXP)S.ob=MAXP-S.op;render();break}
    case 'continueLocal':mode='local';G=migrate(loadSave());ui.view='board';runBots();render();break;
    case 'host':hostGame();break;
    case 'join':joinGame();break;
    case 'cancelHost':endOnline();break;
    case 'watch':net.watch=true;applyDoc(net.doc);render();break;
    case 'leave':net.watch=false;mode='local';G=null;net.rev=0;net.gid=null;render();break;
    case 'home':if(mode==='local'){save();G=null;ui.sheet=null;ui.act=null;ui.sel=null;render()}break;
    case 'view':ui.view=d.v;render();break;
    case 'pick':pick(d.id);break;
    case 'confirm':if(ui.sel)take(ui.sel);break;
    case 'unsel':ui.sel=null;render();break;
    case 'undo':undo();break;
    case 'toggleConfirm':prefConfirm=!prefConfirm;try{localStorage.setItem('furrow-confirm',prefConfirm?'on':'off')}catch(e){}ui.sel=null;render();break;
    case 'tool':ui.act.tool=d.t;render();break;
    case 'crop':ui.act.crop=d.c;render();break;
    case 'cell':tapCell(+d.i);break;
    case 'edge':tapEdge(d.e);break;
    case 'akeep':if(ui.animals){const p=G.players[ui.animals.pi],j=+d.t;ui.animals.keep[j]=Math.max(0,Math.min(p.animals[A[j]],ui.animals.keep[j]+(+d.d)));render()}break;
    case 'animalsOk':resolveAnimals();break;
    case 'clearFences':if(ui.act){ui.act.pending=[];render()}break;
    case 'bake':bake();break;
    case 'buy':buyMajor(d.id,!!d.swap);break;
    case 'play':playCard(d.id);break;
    case 'done':finishAct();break;
    case 'cancel':cancelAct();break;
    case 'cook':cook(d.k);break;
    case 'craft':craft(d.k);break;
    case 'feed':feed();break;
    case 'kitchen':case 'rules':case 'imps':case 'hand':case 'log':ui.sheet=d.do;render();break;
    case 'recapOk':seen[actorIdx()]=G.seq;ui.sheet=null;render();break;
    case 'close':case 'scrim':if(ui.sheet==='recap')seen[actorIdx()]=G.seq;ui.sheet=null;render();break;
    case 'toggleRecap':prefRecap=!prefRecap;try{localStorage.setItem('furrow-recap',prefRecap?'on':'off')}catch(e){}render();break;
    case 'newgame':ui.sheet='confirmNew';render();break;
    case 'reallyNew':if(mode==='online'||!G)endOnline();else clearSave();ui.act=null;ui.sel=null;ui.sheet=null;G=null;mode='local';net.watch=false;net.rev=0;net.gid=null;render();break;
  }
});

function start(data){G=data&&data.G?migrate(data.G):null;mode='local';ui.view='board';render();initNet()}
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>mode==='local'&&G?{G:ui.act?JSON.parse(ui.act.full):G}:{});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
